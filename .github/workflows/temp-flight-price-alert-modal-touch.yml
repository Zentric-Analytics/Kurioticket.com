name: Temporary Flight price alert source update

on:
  push:
    branches:
      - 'fix/flight-price-alert-modal-touch-owner'

permissions:
  contents: write

jobs:
  apply-source-fix:
    if: ${{ !contains(github.event.head_commit.message, '[modal-touch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply narrow Flight popup touch-owner change
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/mobile/src/features/search/ApprovedResultsScreen.tsx')
          source = path.read_text()

          old_modal = '<Modal visible={targetOpen} transparent animationType="none"'
          new_modal = '{targetOpen ? <Modal visible transparent animationType="none"'
          if source.count(old_modal) < 2:
              raise SystemExit('Expected retained Flight and Hotel modal patterns')
          source = source.replace(old_modal, new_modal, 1)

          old_touch = '<ScrollView style={s0.hotelAlertTouchContainer} contentContainerStyle={[s0.flightAlertTouchContent, { height: flightTargetAnchorBottom }]} keyboardShouldPersistTaps="always" keyboardDismissMode="none" scrollEnabled={false} bounces={false}>'
          new_touch = '<View style={[s0.flightAlertTouchContent, { height: flightTargetAnchorBottom }]}>'
          if source.count(old_touch) != 1:
              raise SystemExit('Expected exactly one Flight popup ScrollView touch container')
          source = source.replace(old_touch, new_touch, 1)

          old_close = '</View></ScrollView></View></Modal></View>;'
          new_close = '</View></View></View></Modal> : null}</View>;'
          if source.count(old_close) < 1:
              raise SystemExit('Expected Flight popup retained-modal closing sequence')
          source = source.replace(old_close, new_close, 1)

          path.write_text(source)
          PY
      - name: Verify focused regression
        working-directory: apps/mobile
        run: |
          npm ci
          node --test --require ./testAssetSetup.cjs --import jiti/register src/features/search/ApprovedResultsPriceAlert.test.ts src/features/search/flightPriceAlertGeometry.test.ts
      - name: Verify patch cleanliness
        run: git diff --check
      - name: Commit source fix and remove temporary workflow
        run: |
          rm .github/workflows/temp-flight-price-alert-modal-touch.yml
          git config user.name 'OpenAI direct fix'
          git config user.email 'noreply@openai.com'
          git add apps/mobile/src/features/search/ApprovedResultsScreen.tsx .github/workflows/temp-flight-price-alert-modal-touch.yml
          git commit -m 'Fix Flight price alert direct modal touch ownership [modal-touch-applied]'
          git push origin HEAD:${{ github.ref_name }}