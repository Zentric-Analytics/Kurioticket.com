name: Standardize curated Cars image orientation

on:
  push:
    branches:
      - chatgpt/standardize-curated-cars-image-orientation
    paths:
      - .github/workflows/standardize-cars-image-orientation.yml

permissions:
  contents: write

jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout orientation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chatgpt/standardize-curated-cars-image-orientation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Standardize the six right-facing curated assets
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import subprocess
          from PIL import Image, ImageOps

          root = Path.cwd()
          assets = root / "public/images/cars/results"
          target_names = [
              "skoda-octavia.webp",
              "volkswagen-touran.webp",
              "renault-clio.webp",
              "peugeot-208.webp",
              "mazda-3.webp",
              "bmw-3-series.webp",
          ]

          def restore_readable_patch(original: Image.Image, oriented: Image.Image, box: tuple[int, int, int, int]) -> None:
              x1, y1, x2, y2 = box
              patch = original.crop(box)
              oriented.paste(patch, (original.width - x2, y1), patch)

          for name in target_names:
              path = assets / name
              original = Image.open(path).convert("RGBA")
              if original.size != (1400, 900):
                  raise SystemExit(f"Unexpected source canvas for {name}: {original.size}")

              oriented = ImageOps.mirror(original)

              if name == "skoda-octavia.webp":
                  # Preserve readable model lettering after the horizontal orientation correction.
                  restore_readable_patch(original, oriented, (1012, 574, 1173, 619))
              elif name == "peugeot-208.webp":
                  # Preserve the readable model number on the bonnet trim and front plate.
                  restore_readable_patch(original, oriented, (1018, 428, 1082, 461))
                  restore_readable_patch(original, oriented, (1025, 535, 1110, 586))

              oriented.save(path, format="WEBP", quality=95, method=6)

              check = Image.open(path).convert("RGBA")
              if check.size != (1400, 900):
                  raise SystemExit(f"Canvas contract changed for {name}: {check.size}")
              if check.getchannel("A").getextrema() != (0, 255):
                  raise SystemExit(f"Transparency contract changed for {name}")
              for point in ((0, 0), (1399, 0), (0, 899), (1399, 899)):
                  if check.getpixel(point)[3] != 0:
                      raise SystemExit(f"Transparent-corner contract changed for {name} at {point}")

          helper = root / "src/lib/cars/carResultImage.ts"
          helper_text = helper.read_text(encoding="utf-8")
          old_version = "transparent-cutouts-20260912"
          new_version = "front-left-cutouts-20260914"
          if helper_text.count(old_version) != 1:
              raise SystemExit("Unexpected Cars image version occurrence count in carResultImage.ts")
          helper.write_text(helper_text.replace(old_version, new_version), encoding="utf-8")

          test_file = root / "src/lib/cars/carResultImage.test.ts"
          test_text = test_file.read_text(encoding="utf-8")
          if test_text.count(old_version) != 2:
              raise SystemExit("Unexpected Cars image version occurrence count in carResultImage.test.ts")
          test_file.write_text(test_text.replace(old_version, new_version), encoding="utf-8")

          expected = {
              *(str(Path("public/images/cars/results") / name) for name in target_names),
              "src/lib/cars/carResultImage.ts",
              "src/lib/cars/carResultImage.test.ts",
          }
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          if changed != expected:
              raise SystemExit(
                  "Unexpected changed-file set:\n"
                  f"expected={sorted(expected)}\n"
                  f"actual={sorted(changed)}"
              )
          PY

      - name: Commit standardized assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/images/cars/results/skoda-octavia.webp \
            public/images/cars/results/volkswagen-touran.webp \
            public/images/cars/results/renault-clio.webp \
            public/images/cars/results/peugeot-208.webp \
            public/images/cars/results/mazda-3.webp \
            public/images/cars/results/bmw-3-series.webp \
            src/lib/cars/carResultImage.ts \
            src/lib/cars/carResultImage.test.ts
          git commit -m "Standardize curated Cars image orientation"
          git push origin HEAD:chatgpt/standardize-curated-cars-image-orientation
