name: Admin navigation visual evidence

on:
  pull_request:
    branches: [dev]
    paths:
      - src/components/admin/AdminHorizontalShell.tsx
      - src/components/admin/AdminHorizontalShell.navigation.test.ts
      - qa/admin-identity-directory/**
      - .github/workflows/admin-navigation-visual.yml

permissions:
  contents: read

jobs:
  admin-navigation-screenshots:
    name: Render Admin navigation screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture screenshots from the real Admin shell in isolated QA fixture
        run: node qa/admin-identity-directory/run.mjs
        env:
          ADMIN_IDENTITY_QA_WORK: ${{ runner.temp }}/admin-navigation-qa
          ADMIN_IDENTITY_QA_OUTPUT: ${{ runner.temp }}/admin-navigation-screenshots
      - name: Upload Admin navigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-navigation-visual-evidence
          path: ${{ runner.temp }}/admin-navigation-screenshots/
          if-no-files-found: warn
