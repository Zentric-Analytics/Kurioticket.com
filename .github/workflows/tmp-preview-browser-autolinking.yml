name: Temporary preview browser autolinking check

on:
  push:
    branches:
      - feat/preview-legal-in-app-browser

permissions:
  contents: read

jobs:
  verify-browser-autolinking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci
      - name: Verify Apple autolinking
        working-directory: apps/mobile
        run: |
          npx expo-modules-autolinking resolve --platform apple --json > /tmp/apple-autolinking.json
          grep -q 'expo-web-browser' /tmp/apple-autolinking.json
      - name: Verify Android autolinking
        working-directory: apps/mobile
        run: |
          npx expo-modules-autolinking resolve --platform android --json > /tmp/android-autolinking.json
          grep -q 'expo-web-browser' /tmp/android-autolinking.json
