name: Publish mobile preview update

on:
  pull_request:
    branches:
      - dev
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-preview-update.yml"
  push:
    branches:
      - dev
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-preview-update.yml"
  workflow_dispatch:

concurrency:
  group: mobile-preview-update-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish-preview-update:
    name: Validate and publish mobile preview
    runs-on: ubuntu-latest

    steps:
      - name: Check for EXPO_TOKEN
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Missing EXPO_TOKEN repository secret."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Expo and EAS
        if: github.event_name != 'pull_request'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Type-check mobile app
        working-directory: apps/mobile
        run: npm run typecheck

      - name: Test mobile app
        working-directory: apps/mobile
        run: npm test

      - name: Validate Expo project
        working-directory: apps/mobile
        run: npm run expo:doctor

      - name: Validate Metro export
        working-directory: apps/mobile
        env:
          CI: "1"
        run: npx expo export --platform all --output-dir /tmp/kurioticket-mobile-export --clear

      - name: Select safe delivery method
        id: delivery
        if: github.event_name == 'push'
        shell: bash
        run: |
          git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > /tmp/mobile-changes.txt
          git show "${{ github.event.before }}:apps/mobile/package.json" > /tmp/mobile-package-before.json
          if grep -Eq '^apps/mobile/(app\.json|eas\.json|android/|ios/)' /tmp/mobile-changes.txt || \
             ! node -e "const fs=require('fs'); const normalize=(value)=>Object.entries(value ?? {}).sort(([a],[b])=>a.localeCompare(b)); const before=JSON.parse(fs.readFileSync('/tmp/mobile-package-before.json')); const after=require('./apps/mobile/package.json'); process.exit(JSON.stringify(normalize(before.dependencies)) === JSON.stringify(normalize(after.dependencies)) ? 0 : 1)"; then
            echo "native_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "native_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish update to preview channel
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && steps.delivery.outputs.native_changed != 'true')
        working-directory: apps/mobile
        env:
          CI: "1"
        run: >-
          eas update
          --channel preview
          --environment preview
          --platform all
          --non-interactive
          --message "Automated preview update from dev ${{ github.sha }}"

      - name: Build native preview app
        if: github.event_name == 'push' && steps.delivery.outputs.native_changed == 'true'
        working-directory: apps/mobile
        run: eas build --platform android --profile preview --non-interactive
