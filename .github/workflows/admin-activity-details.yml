name: Admin customer activity visual QA

on:
  pull_request:
    branches: [dev]
    paths:
      - src/app/admin/users/**
      - src/components/admin/AdminIdentityTable*
      - src/components/admin/AdminUsersToolbar*
      - src/components/admin/AdminOnlineUsersDirectory*
      - src/components/admin/AdminUsersLiveRefresh*
      - src/components/admin/AdminDeviceHistoryAutoRefresh*
      - src/components/admin/AdminPageHistoryFilters*
      - src/components/admin/AdminHistoryDirectory*
      - src/components/admin/AdminDeviceHistoryFilters*
      - src/components/admin/PageViewRecords*
      - src/components/admin/AdminCustomerActivityWorkspace.tsx
      - src/components/admin/AdminActivityAccessSummary*
      - src/components/admin/AdminActivityDataDialog*
      - src/components/admin/AdminLiveGuestActivity.tsx
      - src/components/admin/AdminFullActivityWorkspace*
      - src/components/admin/ActivityFiltersBar.tsx
      - src/components/admin/AdminUnifiedActivityList*
      - src/components/admin/AdminGuestAccessHistory.tsx
      - src/lib/adminGuestAccess*
      - src/lib/guestAccessObservation.ts
      - src/lib/guestLiveCountry*
      - src/lib/onlinePresenceWrite*
      - src/lib/onlinePresenceRoute*
      - src/lib/liveGuestPresenceWrite*
      - src/lib/guestPresenceActivityIdentity*
      - src/lib/adminLiveGuestHistory*
      - src/lib/adminLiveGuestActivityNavigation*
      - src/lib/liveGuestHistoryPostgres.test.ts
      - src/services/guestPresenceActivityIdentity.ts
      - src/services/adminLiveGuestHistoryService.ts
      - prisma/migrations/**
      - src/lib/operationalGuestDeviceObservation*
      - src/lib/sessionDeviceObservation*
      - src/services/adminGuestAccessService.ts
      - src/services/adminUnifiedActivityService.ts
      - src/services/adminDeviceSessions*
      - src/components/admin/JourneyEventHistory*
      - src/components/admin/ActivityTimeline.tsx
      - src/components/admin/UserStatusActions.tsx
      - src/components/admin/GuestTrackingActions.tsx
      - src/components/admin/GuestTrackingActions.test.ts
      - src/services/adminGuestManagement*
      - src/app/api/admin/guests/**
      - src/components/admin/ActivityTimeline.test.ts
      - src/components/admin/AdminDirectorySelect.tsx
      - src/components/admin/AdminHorizontalShell.tsx
      - src/lib/adminActivityJourneyNavigation*
      - src/lib/adminActivityDateQuery*
      - src/lib/adminActivityLiveQuery*
      - src/lib/adminActivityOverview*
      - src/lib/adminPageHistory*
      - src/lib/adminDeviceHistory*
      - src/lib/adminIdentityJourneyHistory*
      - src/lib/adminOnlineUsersQuery*
      - src/lib/adminUsersNavigation*
      - src/lib/adminUsersLiveRefresh*
      - src/lib/adminUsersDirectoryPagination*
      - src/lib/adminIdentityDirectory*
      - src/lib/adminSearchActivityNavigation*
      - src/app/api/admin/users/live-refresh/**
      - src/app/admin/searches/**
      - src/app/admin/journeys/**
      - src/lib/adminIdentityActivity*
      - src/lib/adminIdentityJourney.ts
      - src/services/adminIdentityActivityService.ts
      - qa/admin-activity-details/**
      - .github/workflows/admin-activity-details.yml

permissions:
  contents: read

jobs:
  guest-observations-postgres:
    name: Verify identity ownership and access observations on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kurioticket_guest_observations_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kurioticket_guest_observations_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kurioticket_guest_observations_test
      JITI_TSCONFIG_PATHS: ./tsconfig.json
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply schema to disposable database
        run: npx --no-install prisma migrate deploy
      - name: Verify heartbeat ownership, country and current access timing
        run: >-
          GUEST_COUNTRY_TEST_DATABASE_URL="$DATABASE_URL"
          USER_ACCESS_TEST_DATABASE_URL="$DATABASE_URL"
          node --test --import jiti/register
          src/lib/liveGuestPresenceWrite.test.ts
          src/lib/adminGuestAccessPostgres.test.ts
          src/lib/liveGuestHistoryPostgres.test.ts
          src/services/adminDeviceSessionsPostgres.test.ts

  customer-activity:
    name: Validate customer activity page and capture real screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate complete activity, filters and consent ownership helpers
        env:
          JITI_TSCONFIG_PATHS: ./tsconfig.json
          JITI_JSX: "true"
        run: node --test --import jiti/register src/lib/adminActivityJourneyNavigation.test.ts src/lib/adminJourneyPageContract.test.ts src/services/adminJourneyContract.test.ts src/services/adminJourneyCore.test.ts src/components/admin/AdminIdentityTable.test.ts src/components/admin/ActivityTimeline.test.ts src/components/admin/JourneyEventHistory.test.ts src/components/admin/UserStatusActions.test.ts src/components/admin/GuestTrackingActions.test.ts src/services/adminGuestManagement.test.ts src/lib/adminActivityEnvironmentBoundary.test.ts src/lib/adminIdentityActivity.test.ts src/lib/adminIdentityActivityComplete.test.ts src/lib/adminIdentityJourney.test.ts src/lib/guestLiveCountry.test.ts src/lib/guestFirstAccessObservation.test.ts src/lib/onlinePresenceRoute.test.ts src/lib/adminOnlineUsersSnapshot.test.ts src/lib/adminLiveGuestReference.test.ts src/lib/adminNavigation.test.ts src/components/admin/AdminUnifiedActivityList.test.ts src/components/admin/AdminCustomerActivityWorkspace.test.ts src/components/admin/AdminFullActivityWorkspace.test.ts src/lib/adminLiveGuestActivityNavigation.test.ts src/lib/adminLiveGuestHistory.test.ts src/lib/guestPresenceActivityIdentity.test.ts src/lib/adminGuestAccess.test.ts
      - run: npx playwright install --with-deps chromium
      - name: Verify Users automatic updates, filter drafts and return navigation in Chromium
        env:
          JITI_TSCONFIG_PATHS: ./tsconfig.json
          JITI_JSX: "true"
          KURIOTICKET_COMPONENT_EVIDENCE: ${{ runner.temp }}/admin-customer-activity-screenshots/live-updates-navigation
        run: >-
          node --test --import jiti/register
          src/lib/adminUsersLiveRefresh.test.ts
          src/app/api/admin/users/live-refresh/route.test.ts
          src/lib/adminOnlineUsersQuery.test.ts
          src/lib/adminUsersNavigation.test.ts
          src/lib/adminSearchActivityNavigation.test.ts
          src/lib/adminUsersDirectoryPagination.test.ts
          src/lib/adminIdentityDirectory.test.ts
          src/app/admin/users/pagination.test.ts
          src/app/admin/users/visibility.test.ts
          src/lib/adminActivityOverview.test.ts
          src/lib/adminPageHistory.test.ts
          src/lib/adminIdentityJourneyHistory.test.ts
          src/lib/adminActivityLiveQuery.test.ts
          src/lib/adminDeviceHistory.test.ts
          src/components/admin/AdminUsersLiveRefresh.browser.test.ts
          src/components/admin/AdminUnifiedActivityList.browser.test.ts
          src/components/admin/AdminOnlineUsersDirectory.browser.test.ts
          src/components/admin/AdminPageHistoryFilters.browser.test.ts
          src/components/admin/adminStateSynchronization.browser.test.ts
      - name: Render and test real Admin Activity component with labelled QA data
        run: node qa/admin-activity-details/run.mjs
        env:
          ADMIN_ACTIVITY_QA_BASE: ${{ github.event.pull_request.base.sha }}
          ADMIN_ACTIVITY_QA_WORK: ${{ runner.temp }}
          ADMIN_ACTIVITY_QA_OUTPUT: ${{ runner.temp }}/admin-customer-activity-screenshots
      - name: Upload screenshots (fixture content only, not staging data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-customer-activity-visual-evidence
          path: ${{ runner.temp }}/admin-customer-activity-screenshots/
          if-no-files-found: warn
