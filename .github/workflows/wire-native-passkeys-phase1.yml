name: Wire native passkey manager

on:
  push:
    branches:
      - codex/native-passkeys-phase1
    paths:
      - .github/workflows/wire-native-passkeys-phase1.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: codex/native-passkeys-phase1
          fetch-depth: 0

      - name: Wire passkey manager into Security screen
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/mobile/src/features/profile/SecurityScreen.tsx';
          let source = fs.readFileSync(path, 'utf8');
          const passwordImport = 'import { PasswordResetFlow, passwordResetNavigationCopy } from "./PasswordResetFlow";';
          const passkeyImport = 'import { PasskeysManager } from "./PasskeysManager";';
          if (!source.includes(passkeyImport)) {
            if (!source.includes(passwordImport)) throw new Error('PasswordResetFlow import anchor not found');
            source = source.replace(passwordImport, `${passwordImport}\n${passkeyImport}`);
          }
          const startMarker = '    <ScreenModal visible={passkeysOpen} title={c.passkeys} closeLabel={c.close} onClose={closePasskeys}>';
          const endMarker = '    <ScreenModal visible={passwordOpen}';
          const start = source.indexOf(startMarker);
          const end = source.indexOf(endMarker, start);
          if (start < 0 || end < 0) throw new Error('Passkey modal anchors not found');
          const replacement = `    <ScreenModal visible={passkeysOpen} title={c.passkeys} closeLabel={c.close} onClose={closePasskeys}>
      <Text style={[styles.intro,{color:theme.muted}]}>{c.passkeysHelp}</Text><Feedback error={passkeysError} message={passkeysMessage}/>
      <PasskeysManager
        active={passkeysOpen}
        passkeys={passkeys}
        hasPassword={Boolean(overview?.hasPassword)}
        twoFactorEnabled={Boolean(overview?.twoFactorEnabled)}
        onReload={() => loadPasskeys()}
        onUnauthorized={unauth}
        onError={setPasskeysError}
        onMessage={setPasskeysMessage}
      />
    </ScreenModal>
`;
          source = source.slice(0, start) + replacement + source.slice(end);
          fs.writeFileSync(path, source);
          NODE

      - name: Commit Security screen integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/features/profile/SecurityScreen.tsx
          git commit -m "feat(mobile): enable native passkey management"
          git push origin HEAD:codex/native-passkeys-phase1
