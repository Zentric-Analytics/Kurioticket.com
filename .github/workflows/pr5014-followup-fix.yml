name: PR 5014 follow-up fix

on:
  push:
    branches:
      - fix/date-strip-complete-search-identity

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Apply complete search identity fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          screen_path = Path("apps/mobile/src/features/search/ApprovedResultsScreen.tsx")
          source = screen_path.read_text()

          replacements = [
              (
                  '  const pendingDateStripSelection = useRef<{ departureDate: string; returnDate?: string } | null>(null);',
                  '  const pendingDateStripSelection = useRef<string | null>(null);',
              ),
              (
                  '''      const pendingSelection = pendingDateStripSelection.current;\n      pendingDateStripSelection.current = null;\n      if (pendingDateStripSelectionTimer.current) clearTimeout(pendingDateStripSelectionTimer.current);\n      pendingDateStripSelectionTimer.current = undefined;\n      const preserveDateStripPreferences = pendingSelection != null\n        && pendingSelection.departureDate === payload.departureDate\n        && pendingSelection.returnDate === payload.returnDate;''',
                  '''      const pendingSearchKey = pendingDateStripSelection.current;\n      pendingDateStripSelection.current = null;\n      if (pendingDateStripSelectionTimer.current) clearTimeout(pendingDateStripSelectionTimer.current);\n      pendingDateStripSelectionTimer.current = undefined;\n      const preserveDateStripPreferences = pendingSearchKey != null\n        && pendingSearchKey === plan.plan.key;''',
              ),
              (
                  '  }, [cancelFlightPagination, flightResults, payload.departureDate, payload.returnDate, plan.plan?.key]);',
                  '  }, [cancelFlightPagination, flightResults, plan.plan?.key]);',
              ),
              (
                  '''    if (pendingDateStripSelectionTimer.current) clearTimeout(pendingDateStripSelectionTimer.current);\n    pendingDateStripSelection.current = { departureDate: nextDepartureDate, returnDate };''',
                  '''    const expectedSearchPlan = buildSearchPlan("flight", {\n      ...params,\n      departureDate: nextDepartureDate,\n      ...(returnDate ? { returnDate } : {}),\n    }).plan;\n    if (pendingDateStripSelectionTimer.current) clearTimeout(pendingDateStripSelectionTimer.current);\n    pendingDateStripSelection.current = expectedSearchPlan?.key ?? null;''',
              ),
              (
                  '  }, [cancelFlightPagination, flightDate, payload.returnDate, payload.tripType]);',
                  '  }, [cancelFlightPagination, flightDate, params, payload.returnDate, payload.tripType]);',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in ApprovedResultsScreen.tsx, found {count}: {old[:80]!r}")
              source = source.replace(old, new)

          screen_path.write_text(source)

          test_path = Path("apps/mobile/src/features/search/flightResultsPagination.test.ts")
          test_source = test_path.read_text()

          test_replacements = [
              (
                  '  assert.match(selection, /pendingDateStripSelection\\.current = \\{ departureDate: nextDepartureDate, returnDate \\};[\\s\\S]*?router\\.setParams/);',
                  '  assert.match(selection, /const expectedSearchPlan = buildSearchPlan\\("flight", \\{[\\s\\S]*?\\.\\.\\.params,[\\s\\S]*?departureDate: nextDepartureDate,[\\s\\S]*?returnDate[\\s\\S]*?\\}\\)\\.plan;[\\s\\S]*?pendingDateStripSelection\\.current = expectedSearchPlan\\?\\.key \\?\\? null;[\\s\\S]*?router\\.setParams/);',
              ),
              (
                  '  assert.match(identity, /const pendingSelection = pendingDateStripSelection\\.current;[\\s\\S]*?pendingDateStripSelection\\.current = null/);',
                  '  assert.match(identity, /const pendingSearchKey = pendingDateStripSelection\\.current;[\\s\\S]*?pendingDateStripSelection\\.current = null/);',
              ),
              (
                  '  assert.match(identity, /pendingSelection != null[\\s\\S]*?pendingSelection\\.departureDate === payload\\.departureDate[\\s\\S]*?pendingSelection\\.returnDate === payload\\.returnDate/);',
                  '  assert.match(identity, /const pendingSearchKey = pendingDateStripSelection\\.current;[\\s\\S]*?pendingSearchKey != null[\\s\\S]*?pendingSearchKey === plan\\.plan\\.key/);\n  assert.doesNotMatch(identity, /pendingSearchKey[\\s\\S]*?payload\\.(?:departureDate|returnDate)/);',
              ),
          ]

          for old, new in test_replacements:
              count = test_source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in flightResultsPagination.test.ts, found {count}: {old[:80]!r}")
              test_source = test_source.replace(old, new)

          test_path.write_text(test_source)
          PY

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Type-check mobile
        working-directory: apps/mobile
        run: npm run typecheck

      - name: Run focused regression tests
        working-directory: apps/mobile
        run: node --test --require ./testAssetSetup.cjs --import jiti/register src/features/search/flightResultsPagination.test.ts src/features/search/dateStripNaturalScroll.test.ts

      - name: Publish clean fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "Adekunlea917"
          git config user.email "adetunji.kaseem@zentricanalytics.com"
          rm .github/workflows/pr5014-followup-fix.yml
          rm -f .github/pr5014-trigger.txt
          git add apps/mobile/src/features/search/ApprovedResultsScreen.tsx apps/mobile/src/features/search/flightResultsPagination.test.ts .github/workflows/pr5014-followup-fix.yml .github/pr5014-trigger.txt
          git commit -m "fix(mobile): validate complete date-strip search identity"
          git push origin HEAD:fix/date-strip-complete-search-identity
