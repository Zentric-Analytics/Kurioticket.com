name: Temporary preview browser lockfile sync

on:
  push:
    branches:
      - feat/preview-legal-in-app-browser

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/preview-legal-in-app-browser
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Synchronize mobile lockfile
        working-directory: apps/mobile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- apps/mobile/package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package-lock.json
          git commit -m "chore(mobile): sync web browser lockfile [lockfile-sync]"
          git push origin HEAD:feat/preview-legal-in-app-browser
