name: Import Cars image assets

on:
  push:
    branches:
      - chatgpt/standardize-car-vehicle-imagery
    paths:
      - car-assets-upload.zip

permissions:
  contents: write

jobs:
  import-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the asset branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/standardize-car-vehicle-imagery
          fetch-depth: 0

      - name: Verify the approved ZIP exactly
        shell: bash
        run: |
          set -euo pipefail
          echo "a2b25c223f1dd0069dd0677597591421d88ce6a0c0988cbf1ac87402bebd0809  car-assets-upload.zip" | sha256sum -c -

      - name: Verify the archive contains the canonical 30 filenames
        shell: bash
        run: |
          set -euo pipefail
          unzip -Z1 car-assets-upload.zip | sort > /tmp/archive-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          audi-a4.webp
          bmw-3-series.webp
          citroen-grand-c4-spacetourer.webp
          dacia-duster.webp
          fiat-500.webp
          ford-focus.webp
          ford-tourneo.webp
          honda-civic.webp
          hyundai-i20.webp
          hyundai-tucson.webp
          kia-sportage.webp
          mazda-3.webp
          mercedes-benz-c-class.webp
          mercedes-benz-e-class.webp
          mercedes-benz-v-class.webp
          nissan-qashqai.webp
          opel-corsa.webp
          peugeot-208.webp
          peugeot-3008.webp
          renault-captur.webp
          renault-clio.webp
          skoda-octavia.webp
          toyota-camry.webp
          toyota-corolla.webp
          toyota-rav4.webp
          toyota-yaris.webp
          volkswagen-golf.webp
          volkswagen-passat.webp
          volkswagen-touran.webp
          volvo-xc60.webp
          EOF
          diff -u /tmp/expected-files.txt /tmp/archive-files.txt

      - name: Replace the Cars catalogue assets
        shell: bash
        run: |
          set -euo pipefail
          unzip -jo car-assets-upload.zip '*.webp' -d public/images/cars/results
          test "$(find public/images/cars/results -maxdepth 1 -type f -name '*.webp' | wc -l | tr -d ' ')" = "30"
          rm car-assets-upload.zip

      - name: Commit the validated binary assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/cars/results/*.webp car-assets-upload.zip
          git commit -m "Standardize Cars vehicle image assets"
          git push origin HEAD:chatgpt/standardize-car-vehicle-imagery
