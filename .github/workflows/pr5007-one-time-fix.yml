name: PR 5007 one-time pagination fix

on:
  push:
    branches:
      - codex/fix-native-mobile-flight-results-pagination

permissions:
  contents: write

jobs:
  apply-fix:
    if: "github.event.head_commit.message == 'chore: run PR 5007 pagination fix v2'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-native-mobile-flight-results-pagination
          fetch-depth: 0
      - name: Apply and verify targeted pagination fix
        shell: python
        run: |
          from pathlib import Path

          screen_path = Path('apps/mobile/src/features/search/ApprovedResultsScreen.tsx')
          screen = screen_path.read_text()
          old = '{flightPaginationPendingPage !== null && index < 3 ? <View style={s0.flightPaginationSkeletonCard} pointerEvents="none"><FlightLoadingSkeleton /></View> : null}'
          new = '{flightPaginationPendingPage !== null ? <View style={s0.flightPaginationSkeletonCard} pointerEvents="none"><FlightLoadingSkeleton /></View> : null}'
          if screen.count(old) != 1:
              raise SystemExit(f'Expected exactly one pagination skeleton condition, found {screen.count(old)}')
          screen = screen.replace(old, new, 1)
          if old in screen or screen.count(new) != 1:
              raise SystemExit('Pagination skeleton replacement did not produce the expected source')
          screen_path.write_text(screen)

          test_path = Path('apps/mobile/src/features/search/flightResultsPagination.test.ts')
          test = test_path.read_text()
          old_test = r'/flightPaginationPendingPage !== null && index < 3 \? <View[^>]*><FlightLoadingSkeleton \/><\/View>/'
          new_test = r'/flightPaginationPendingPage !== null \? <View[^>]*><FlightLoadingSkeleton \/><\/View>/'
          if test.count(old_test) != 1:
              raise SystemExit(f'Expected exactly one pagination skeleton assertion, found {test.count(old_test)}')
          test = test.replace(old_test, new_test, 1)
          if old_test in test or test.count(new_test) != 1:
              raise SystemExit('Pagination regression assertion did not update as expected')
          test_path.write_text(test)
      - name: Check patch integrity
        run: git diff --check
      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr5007-one-time-fix.yml
          git add apps/mobile/src/features/search/ApprovedResultsScreen.tsx apps/mobile/src/features/search/flightResultsPagination.test.ts
          git commit -m 'fix(mobile): cover all hidden cards during pagination'
          git push origin HEAD:codex/fix-native-mobile-flight-results-pagination
