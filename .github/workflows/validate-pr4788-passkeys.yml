name: Validate PR 4788 passkey sign-in

on:
  push:
    branches:
      - codex/implement-mobile-sign-in-with-passkey
    paths:
      - .github/workflows/validate-pr4788-passkeys.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run focused passkey and access tests
        run: >-
          npx cross-env JITI_TSCONFIG_PATHS=true node --test --import jiti/register
          src/lib/bounded-json-body.test.ts
          src/lib/passkeys-origin.test.ts
          src/lib/previewTesterAccess.test.ts
          src/lib/account-session.test.ts
          src/services/mobilePasskeyAuthentication.test.ts
      - name: Build the server application
        run: npm run build
      - name: Check branch diff formatting
        run: git diff --check origin/dev...HEAD
