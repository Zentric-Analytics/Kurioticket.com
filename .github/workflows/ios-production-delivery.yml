name: iOS Production Delivery
on:
  workflow_dispatch:
    inputs:
      commit_sha: { description: "Exact approved full commit SHA reachable from protected main", required: true, type: string }
      platform: { description: "Must be ios", required: true, type: choice, options: [ios] }
      action: { description: "Approved delivery action", required: true, type: choice, options: [dry-run, build, update] }
      runtime_version: { description: "Expected runtime", required: true, type: string }
      release_reason: { description: "Approval or release reference", required: true, type: string }
      confirmation_phrase: { description: "Type DELIVER IOS PRODUCTION", required: true, type: string }
      expected_bundle_identifier: { description: "Expected iOS bundle identifier", required: true, type: string }
      expected_channel: { description: "Expected EAS channel", required: true, type: string }
      baseline_eas_build_id: { description: "NONE for dry-run/build; exact reviewed iOS build ID for update", required: true, type: string }
permissions: { contents: read }
concurrency: { group: ios-production-delivery, cancel-in-progress: false }
jobs:
  deliver:
    environment: mobile-production
    runs-on: macos-15
    env:
      APP_VARIANT: production
      APP_BUILD_MODE: release
      EXPO_PUBLIC_API_BASE_URL: https://kurioticket.com
      EAS_BUILD_PLATFORM: ios
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0 }
      - name: Capture release workflow start
        run: echo "WORKFLOW_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Verify exact approved Production checkout
        env: { APPROVED_SHA: "${{ inputs.commit_sha }}", WORKFLOW_SHA: "${{ github.sha }}" }
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          test "$ACTUAL_SHA" = "$APPROVED_SHA" || { echo 'Checked-out Production SHA does not match approval.' >&2; exit 1; }
          test "$WORKFLOW_SHA" = "$APPROVED_SHA" || { echo 'Workflow source SHA does not match approval.' >&2; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor "$APPROVED_SHA" origin/main || { echo 'Approved SHA is not reachable from protected main.' >&2; exit 1; }
          echo "CHECKED_OUT_SHA=$ACTUAL_SHA" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - working-directory: apps/mobile
        run: npm ci
      - name: Validate immutable iOS Production inputs
        working-directory: apps/mobile
        env:
          APPROVED_SHA: "${{ inputs.commit_sha }}"
          APPROVED_RUNTIME: "${{ inputs.runtime_version }}"
          APPROVED_BUNDLE_IDENTIFIER: "${{ inputs.expected_bundle_identifier }}"
          APPROVED_CHANNEL: "${{ inputs.expected_channel }}"
          APPROVED_CONFIRMATION: "${{ inputs.confirmation_phrase }}"
          DELIVERY_ACTION: "${{ inputs.action }}"
          RELEASE_REASON: "${{ inputs.release_reason }}"
          BASELINE_EAS_BUILD_ID: "${{ inputs.baseline_eas_build_id }}"
        run: |
          node scripts/validate-ios-production-inputs.mjs \
            "$APPROVED_SHA" \
            "$APPROVED_RUNTIME" \
            "$APPROVED_BUNDLE_IDENTIFIER" \
            "$APPROVED_CHANNEL" \
            "$APPROVED_CONFIRMATION" \
            "$DELIVERY_ACTION" \
            "$RELEASE_REASON" \
            "$BASELINE_EAS_BUILD_ID"
      - name: Validate mobile and release architecture
        working-directory: apps/mobile
        run: |
          npm run typecheck
          npm test
          npm run expo:doctor
          npm run release:validate
          npm run test:release-pipeline
          npm run verify:ios-icon
      - name: Resolve and validate Production iOS configuration
        working-directory: apps/mobile
        env: { EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}" }
        run: |
          test -n "$EXPO_TOKEN" || { echo 'Required environment EXPO_TOKEN is missing.' >&2; exit 1; }
          npx eas-cli@16.17.4 env:exec production "npx expo config --type public --json" --non-interactive > "$RUNNER_TEMP/production-public.json"
          npx eas-cli@16.17.4 env:exec production "npx expo config --type prebuild --json" --non-interactive > "$RUNNER_TEMP/production-prebuild.json"
          node -e "const c=require(process.env.RUNNER_TEMP+'/production-public.json');if(c.name!=='Kurioticket'||c.ios.bundleIdentifier!=='com.kurioticket.app'||c.scheme!=='kurioticket'||c.runtimeVersion!=='production-0.3.0'||c.extra.environment.channel!=='production'||c.extra.environment.apiBaseUrl!=='https://kurioticket.com'||c.extra.environment.isPreview!==false)throw Error('Production iOS configuration mismatch')"
          node -e "const c=require(process.env.RUNNER_TEMP+'/production-prebuild.json');const r=require('./release-policy.json').production;const expected='com.googleusercontent.apps.'+r.googleIosClientId.replace(/\.apps\.googleusercontent\.com$/,'');const plugin=c.plugins.find(p=>Array.isArray(p)&&p[0]==='react-native-nitro-google-signin');if(plugin?.[1]?.iosUrlScheme!==expected)throw Error('Production Google iOS plugin identity mismatch')"
      - name: Resolve approved iOS binary baseline
        if: inputs.action == 'update'
        working-directory: apps/mobile
        env: { EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}", BASELINE_EAS_BUILD_ID: "${{ inputs.baseline_eas_build_id }}" }
        run: |
          test -n "$EXPO_TOKEN" || { echo 'Required environment EXPO_TOKEN is missing.' >&2; exit 1; }
          test "$BASELINE_EAS_BUILD_ID" = ec28bb4d-44fe-4e07-bdb0-c0a8aec90fe9 || { echo 'Unreviewed iOS Production baseline.' >&2; exit 1; }
          test -f release-baselines/ios/production.json || { echo 'Reviewed iOS Production binary manifest is missing.' >&2; exit 1; }
          npx eas-cli@16.17.4 build:view "$BASELINE_EAS_BUILD_ID" --json > "$RUNNER_TEMP/baseline-build.json"
          node scripts/verify-release-evidence.mjs --kind baseline --variant production --manifest release-baselines/ios/production.json --build "$RUNNER_TEMP/baseline-build.json" --output "$RUNNER_TEMP/baseline-evidence.json"
      - name: Classify iOS native versus OTA delivery
        if: inputs.action == 'update'
        working-directory: apps/mobile
        env: { EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}", APPROVED_SHA: "${{ inputs.commit_sha }}" }
        run: |
          set -o pipefail
          npx eas-cli@16.17.4 env:exec production "npx fingerprint fingerprint:generate --platform ios" --non-interactive > "$RUNNER_TEMP/current-fingerprint.json"
          BASE=$(node -e "const x=require(process.env.RUNNER_TEMP+'/baseline-evidence.json');process.stdout.write(x.commitSha)")
          BASE_FP=$(node -e "const x=require(process.env.RUNNER_TEMP+'/baseline-evidence.json');process.stdout.write(x.nativeFingerprint)")
          CURRENT_FP=$(node -e "const x=require(process.env.RUNNER_TEMP+'/current-fingerprint.json');process.stdout.write(x.hash)")
          node scripts/classify-release.mjs --variant production --base "$BASE" --head "$APPROVED_SHA" --baseline-fingerprint "$BASE_FP" --current-fingerprint "$CURRENT_FP" --runtime production-0.3.0 --channel production --action update | tee "$RUNNER_TEMP/release-classification.json"
          node -e "const x=require(process.env.RUNNER_TEMP+'/release-classification.json');if(x.classification!=='ota-compatible')throw Error('iOS Production update is not OTA-compatible')"
      - name: Verify live Production channel mapping
        if: inputs.action == 'update'
        working-directory: apps/mobile
        env: { EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}" }
        run: |
          npx eas-cli@16.17.4 channel:view production --json --non-interactive > "$RUNNER_TEMP/channel.json"
          node scripts/verify-release-evidence.mjs --kind channel --variant production --input "$RUNNER_TEMP/channel.json" --output "$RUNNER_TEMP/channel-evidence.json"
      - name: Verify remote iOS version and credential readiness
        working-directory: apps/mobile
        env: { EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}" }
        run: |
          test -f release-baselines/ios/production-credential.json || { echo 'Reviewed iOS Production credential evidence is missing.' >&2; exit 1; }
          node -e "const c=require('./release-baselines/ios/production-credential.json');if(c.projectId!=='89f6fd88-c0d7-495a-9e2b-8301b09f407d'||c.bundleIdentifier!=='com.kurioticket.app'||c.profile!=='production'||c.appleTeamId!=='N23R45R4CY'||c.management!=='eas-managed'||c.status!=='complete'||c.buildPolicy!=='freeze-credentials')throw Error('iOS Production credential evidence mismatch')"
          npx eas-cli@16.17.4 build:version:get --platform ios --profile production --json --non-interactive > "$RUNNER_TEMP/ios-version.json"
          npx eas-cli@16.17.4 build:list --platform ios --build-profile production --app-identifier com.kurioticket.app --limit 10 --json --non-interactive > "$RUNNER_TEMP/ios-builds.json"
          node -e "const v=require(process.env.RUNNER_TEMP+'/ios-version.json');const b=require(process.env.RUNNER_TEMP+'/ios-builds.json');const remote=Number(v.buildNumber??v.ios?.buildNumber??0);const highest=Math.max(0,...b.map(x=>Number(x.appBuildVersion||0)));if(remote<highest)throw Error('Remote iOS build number is behind build history')"
      - name: Complete non-mutating Production dry run
        if: inputs.action == 'dry-run'
        run: echo "iOS Production dry run passed for $CHECKED_OUT_SHA; no build or submission was started."
      - name: Build and verify approved Production IPA
        if: inputs.action == 'build'
        working-directory: apps/mobile
        env: { EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}" }
        run: |
          npx eas-cli@16.17.4 build --platform ios --profile production --non-interactive --freeze-credentials --json > "$RUNNER_TEMP/build-result.json"
          BUILD_ID=$(node -e "const x=require(process.env.RUNNER_TEMP+'/build-result.json');const b=Array.isArray(x)?x[0]:x;if(!b?.id)throw Error('Build result is missing an ID');process.stdout.write(b.id)")
          npx eas-cli@16.17.4 build:view "$BUILD_ID" --json > "$RUNNER_TEMP/build.json"
          IPA_URL=$(node -e "const b=require(process.env.RUNNER_TEMP+'/build.json');if(b.status!=='FINISHED'||b.platform!=='IOS'||b.gitCommitHash!==process.env.CHECKED_OUT_SHA||b.project?.id!=='89f6fd88-c0d7-495a-9e2b-8301b09f407d'||b.buildProfile!=='production'||b.distribution!=='STORE'||b.channel!=='production'||b.runtimeVersion!=='production-0.3.0'||b.appVersion!=='0.3.0'||!/^[1-9]\d*$/.test(String(b.appBuildVersion??''))||(b.applicationIdentifier!=null&&b.applicationIdentifier!=='com.kurioticket.app'))throw Error('Finished build identity mismatch');const u=b.artifacts?.applicationArchiveUrl??b.artifacts?.buildUrl;if(!/^https:\/\//.test(u||''))throw Error('IPA URL missing');process.stdout.write(u)")
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --output "$RUNNER_TEMP/production.ipa" "$IPA_URL"
          unzip -q "$RUNNER_TEMP/production.ipa" -d "$RUNNER_TEMP/ipa"
          APP_CANDIDATES=("$RUNNER_TEMP"/ipa/Payload/*.app)
          test "${#APP_CANDIDATES[@]}" -eq 1 && test -d "${APP_CANDIDATES[0]}" || { echo 'IPA must contain exactly one application bundle.' >&2; exit 1; }
          APP="${APP_CANDIDATES[0]}"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --extract-certificates="$RUNNER_TEMP/app-signer" "$APP"
          openssl x509 -inform DER -in "$RUNNER_TEMP/app-signer0" -noout -serial | sed 's/^serial=//' > "$RUNNER_TEMP/signer-certificate-serial.txt"
          PLIST="$APP/Info.plist"
          python - "$PLIST" "$RUNNER_TEMP/info.json" <<'PY'
          import json, plistlib, sys
          with open(sys.argv[1], 'rb') as f: value=plistlib.load(f)
          with open(sys.argv[2], 'w') as f: json.dump(value, f)
          PY
          APP_CONFIG=$(find "$APP" -path '*/EXConstants.bundle/app.config' -print -quit)
          test -n "$APP_CONFIG" || { echo 'IPA embedded Expo app configuration is missing.' >&2; exit 1; }
          python - "$APP_CONFIG" "$RUNNER_TEMP/app-config.json" <<'PY'
          import json, sys
          with open(sys.argv[1], 'r', encoding='utf-8') as f: value=json.load(f)
          with open(sys.argv[2], 'w') as f: json.dump(value, f)
          PY
          EXPO_PLIST=$(find "$APP" -name Expo.plist -print -quit)
          test -n "$EXPO_PLIST" || { echo 'IPA Expo Updates configuration is missing.' >&2; exit 1; }
          python - "$EXPO_PLIST" "$RUNNER_TEMP/expo-config.json" <<'PY'
          import json, plistlib, sys
          with open(sys.argv[1], 'rb') as f: value=plistlib.load(f)
          with open(sys.argv[2], 'w') as f: json.dump(value, f)
          PY
          PROFILE="$APP/embedded.mobileprovision"
          test -f "$PROFILE" || { echo 'IPA provisioning profile is missing.' >&2; exit 1; }
          test -n "$PROFILE" || { echo 'IPA embedded provisioning profile is missing.' >&2; exit 1; }
          openssl smime -inform der -verify -noverify -in "$PROFILE" -out "$RUNNER_TEMP/provisioning-profile.plist"
          python - "$RUNNER_TEMP/provisioning-profile.plist" "$RUNNER_TEMP/provisioning-profile.json" "$RUNNER_TEMP" <<'PY'
          import json, pathlib, plistlib, sys
          with open(sys.argv[1], 'rb') as f: profile = plistlib.load(f)
          certificates = profile.pop('DeveloperCertificates', [])
          safe = {key: profile.get(key) for key in ('UUID', 'Name', 'TeamIdentifier', 'Entitlements')}
          with open(sys.argv[2], 'w') as f: json.dump(safe, f)
          for index, certificate in enumerate(certificates):
              pathlib.Path(sys.argv[3], f'profile-certificate-{index}.der').write_bytes(certificate)
          PY
          python - "$RUNNER_TEMP" "$RUNNER_TEMP/certificate-serials.json" <<'PY'
          import glob, json, subprocess, sys
          serials = []
          for path in glob.glob(sys.argv[1] + '/profile-certificate-*.der'):
              output = subprocess.check_output(['openssl', 'x509', '-inform', 'DER', '-in', path, '-noout', '-serial'], text=True).strip()
              serials.append(output.removeprefix('serial='))
          if not serials: raise SystemExit('Provisioning profile contains no signing certificate')
          with open(sys.argv[2], 'w') as f: json.dump(serials, f)
          PY
          node scripts/verify-production-ipa.mjs --plist "$RUNNER_TEMP/info.json" --app-config "$RUNNER_TEMP/app-config.json" --expo-config "$RUNNER_TEMP/expo-config.json" --provisioning-profile "$RUNNER_TEMP/provisioning-profile.json" --certificate-serials "$RUNNER_TEMP/certificate-serials.json" --signer-certificate-serial "$RUNNER_TEMP/signer-certificate-serial.txt" --output "$RUNNER_TEMP/ipa-evidence.json"
      - name: Publish approved iOS Production OTA through verified channel
        if: inputs.action == 'update'
        working-directory: apps/mobile
        env: { EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}", RELEASE_REASON: "${{ inputs.release_reason }}" }
        run: |
          set -o pipefail
          npx eas-cli@16.17.4 update --channel production --platform ios --message "$RELEASE_REASON" --non-interactive --json | tee "$RUNNER_TEMP/delivery-result.raw.json"
          node scripts/verify-production-eas-result.mjs --kind update --platform ios --input "$RUNNER_TEMP/delivery-result.raw.json" --sha "$CHECKED_OUT_SHA" --output "$RUNNER_TEMP/delivery-result.json"
      - name: Write consolidated iOS update audit
        if: always() && inputs.action == 'update'
        working-directory: apps/mobile
        env:
          WORKFLOW_RUN_ID: "${{ github.run_id }}"
          WORKFLOW_HEAD_SHA: "${{ env.CHECKED_OUT_SHA }}"
          RELEASE_ACTOR: "${{ github.actor }}"
          RELEASE_ENVIRONMENT: production
          RELEASE_ACTION: update
          RELEASE_REASON: "${{ inputs.release_reason }}"
          RELEASE_COMMIT: "${{ inputs.commit_sha }}"
          RELEASE_PACKAGE: com.kurioticket.app
          RELEASE_PROFILE: production
          RELEASE_RUNTIME: production-0.3.0
          RELEASE_CHANNEL: production
          BASELINE_EAS_BUILD_ID: "${{ inputs.baseline_eas_build_id }}"
          BASELINE_EVIDENCE_PATH: "${{ runner.temp }}/baseline-evidence.json"
          CHANNEL_EVIDENCE_PATH: "${{ runner.temp }}/channel-evidence.json"
          CURRENT_FINGERPRINT_PATH: "${{ runner.temp }}/current-fingerprint.json"
          CLASSIFIER_PATH: "${{ runner.temp }}/release-classification.json"
          DELIVERY_RESULT_PATH: "${{ runner.temp }}/delivery-result.json"
          AUDIT_OUTPUT: "${{ runner.temp }}/release-audit.json"
          WORKFLOW_STARTED_AT: "${{ env.WORKFLOW_STARTED_AT }}"
          FINAL_STATUS: "${{ job.status }}"
          PRIOR_JOB_STATUS: "${{ job.status }}"
        run: |
          set +e
          node scripts/write-release-audit.mjs
          AUDIT_EXIT=$?
          set -e
          if [ "$AUDIT_EXIT" -ne 0 ] && [ "$PRIOR_JOB_STATUS" != failure ]; then exit "$AUDIT_EXIT"; fi
          if [ "$AUDIT_EXIT" -ne 0 ]; then echo 'Release audit generation also failed after the authoritative delivery failure.' >&2; fi
      - name: Preserve non-secret iOS release evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ios-production-release-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/production-public.json
            ${{ runner.temp }}/production-prebuild.json
            ${{ runner.temp }}/ios-version.json
            ${{ runner.temp }}/ios-builds.json
            ${{ runner.temp }}/build.json
            ${{ runner.temp }}/ipa-evidence.json
            ${{ runner.temp }}/baseline-evidence.json
            ${{ runner.temp }}/channel-evidence.json
            ${{ runner.temp }}/current-fingerprint.json
            ${{ runner.temp }}/release-classification.json
            ${{ runner.temp }}/delivery-result.raw.json
            ${{ runner.temp }}/delivery-result.json
            ${{ runner.temp }}/release-audit.json
          if-no-files-found: warn
          retention-days: 365
