name: Install native passkey dependency

on:
  push:
    branches:
      - codex/native-passkeys-phase1
    paths:
      - .github/workflows/install-native-passkeys-phase1.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: codex/native-passkeys-phase1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install published passkey package
        working-directory: apps/mobile
        run: npm install --package-lock-only --ignore-scripts --save-exact react-native-passkeys@0.4.2

      - name: Verify clean dependency installation
        working-directory: apps/mobile
        run: npm ci

      - name: Commit package files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package.json apps/mobile/package-lock.json
          git commit -m "chore(mobile): add native passkey dependency"
          git push origin HEAD:codex/native-passkeys-phase1
