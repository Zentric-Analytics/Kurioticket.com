name: PR 5031 semantic dev sync

on:
  push:
    branches:
      - codex/remove-bottomnav-from-flight-results
    paths:
      - .github/workflows/pr5031-codex-fix.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/remove-bottomnav-from-flight-results
          fetch-depth: 0
      - name: Merge latest dev and reapply PR semantics
        shell: bash
        run: |
          git fetch origin dev
          git merge --no-commit --no-ff origin/dev || true
          git checkout origin/dev -- apps/mobile/src/features/search/ApprovedResultsScreen.tsx apps/mobile/src/features/search/resultsScrollLayout.test.ts apps/mobile/src/features/search/hotelResultsFooter.test.ts
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/mobile/src/features/search/ApprovedResultsScreen.tsx'); s=p.read_text()
          old='          contentContainerStyle={[s0.flightResultsContent, flightPaginationMinHeight !== null && { minHeight: flightPaginationMinHeight }]}\n'
          new='''          contentContainerStyle={[\n            s0.flightResultsContent,\n            { paddingBottom: Math.max(insets.bottom + 16, 16) },\n            flightPaginationMinHeight !== null && { minHeight: flightPaginationMinHeight },\n          ]}\n'''
          assert old in s
          s=s.replace(old,new,1)
          mount='      {flightResults ? <BottomNav flightResults /> : null}\n'; assert mount in s; s=s.replace(mount,'',1)
          body='  flightResultsBody: { paddingHorizontal: 14, gap: 8 },'; assert body in s; s=s.replace(body,'  flightResultsBody: { paddingHorizontal: 14, paddingBottom: 0, gap: 8 },',1)
          pag='  flightPagination: { paddingHorizontal: 14, paddingTop: 6, paddingBottom: 104, flexDirection: "row", alignItems: "center", justifyContent: "space-between", gap: 4 },'; assert pag in s; s=s.replace(pag,'  flightPagination: { paddingHorizontal: 14, paddingTop: 6, paddingBottom: 6, flexDirection: "row", alignItems: "center", justifyContent: "space-between", gap: 4 },',1)
          p.write_text(s)

          p=Path('apps/mobile/src/features/search/resultsScrollLayout.test.ts'); s=p.read_text()
          q='const quickControls = readFileSync(resolve("src/features/search/FlightResultsQuickControls.tsx"), "utf8");\n'; assert q in s; s=s.replace(q,q+'const carScreen = readFileSync(resolve("src/features/search/ApprovedCarResultsScreen.tsx"), "utf8");\n',1)
          a=s.index('test("Hotel Results reclaims BottomNav space while retaining the native bottom safe area"'); b=s.index('\n\ntest("Hotel Back-to-top keeps its geometry',a)
          r='''test("Flight Results scroll content clears the native bottom safe area without navigation-sized footer padding", () => {
            const paginationFooter = styleBlock("flightPagination", "flightPaginationPages");
            const terminalFooter = styleBlock("flightResultsBody", "flightCardItem");
            assert.match(screen, /const insets = useSafeAreaInsets\\(\\)/);
            assert.match(flightLayout, /contentContainerStyle=\\{\\[[\\s\\S]*?s0\\.flightResultsContent,[\\s\\S]*?\\{ paddingBottom: Math\\.max\\(insets\\.bottom \\+ 16, 16\\) \\},[\\s\\S]*?minHeight: flightPaginationMinHeight/);
            assert.match(paginationFooter, /paddingBottom: 6/);
            assert.doesNotMatch(paginationFooter, /paddingBottom:\\s*(?:92|104)/);
            assert.match(terminalFooter, /paddingBottom: 0/);
            assert.doesNotMatch(terminalFooter, /paddingBottom:\\s*(?:92|104)/);
            assert.doesNotMatch(flightLayout, /paddingBottom[^\\n]*(?:72|92|104)/);
            assert.doesNotMatch(flightLayout, /position:\\s*["']absolute["']/);
          });

          test("results screens retain their product-specific BottomNav ownership", () => {
            const sharedBody = styleBlock("body", "hotelResultsContent");
            const backToTop = styleBlock("hotelBackToTop", "filterRail");
            assert.match(sharedBody, /paddingBottom: 92/);
            assert.match(screen, /style=\\{\\[s0\\.body, \\{ paddingBottom: Math\\.max\\(insets\\.bottom \\+ 16, 16\\) \\}\\]\\}/);
            assert.doesNotMatch(screen.slice(screen.indexOf("export function ApprovedResultsScreen"), screen.indexOf("export function BottomNav")), /<BottomNav(?:\\s|\\/|>)/);
            assert.match(carScreen, /import \\{ BottomNav \\} from "\\.\\/ApprovedResultsScreen"/);
            assert.match(carScreen, /<BottomNav \\/>/);
            assert.doesNotMatch(backToTop, /bottom:/);
            assert.match(screen, /s0\\.hotelBackToTop,\\{bottom:Math\\.max\\(insets\\.bottom \\+ 16,16\\)/);
          });'''
          p.write_text(s[:a]+r+s[b:])

          p=Path('apps/mobile/src/features/search/hotelResultsFooter.test.ts'); s=p.read_text()
          old='''test("BottomNav ownership remains Flight-only", () => {
            assert.match(screen, /\\{flightResults \\? <BottomNav flightResults \\/> : null\\}/);
            assert.doesNotMatch(screen, /<BottomNav flightResults=\\{flightResults\\} \\/>/);
          });'''; assert old in s
          new='''test("Hotel Results remains without BottomNav", () => {
            const resultsScreen = screen.slice(screen.indexOf("export function ApprovedResultsScreen"), screen.indexOf("export function BottomNav"));
            assert.doesNotMatch(resultsScreen, /<BottomNav(?:\\s|\\/|>)/);
          });'''
          p.write_text(s.replace(old,new,1))
          PY
          git add apps/mobile/src/features/search/ApprovedResultsScreen.tsx apps/mobile/src/features/search/resultsScrollLayout.test.ts apps/mobile/src/features/search/hotelResultsFooter.test.ts
          unresolved=$(git diff --name-only --diff-filter=U)
          test -z "$unresolved" || { echo "$unresolved"; exit 1; }
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "merge dev into PR 5031 with flight results layout semantics"
          git push origin HEAD:codex/remove-bottomnav-from-flight-results
      - name: Install
        working-directory: apps/mobile
        run: npm ci
      - name: Typecheck
        working-directory: apps/mobile
        run: npm run typecheck
      - name: Focused tests
        working-directory: apps/mobile
        run: node --test --require ./testAssetSetup.cjs --import jiti/register src/features/search/resultsScrollLayout.test.ts src/features/search/flightResultsPagination.test.ts src/features/search/bottomNavNavigation.test.ts src/features/search/flightResultsHeader.test.ts src/features/search/hotelResultsFooter.test.ts src/features/search/nativeHotelDetailsPlatformParity.test.ts src/features/flow/stableVerticalScrolling.test.ts
      - name: Diff check
        run: git diff --check
