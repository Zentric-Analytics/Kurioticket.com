name: Search architecture acceptance

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: search-architecture-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: Search backend regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3010
      NEXTAUTH_URL: http://127.0.0.1:3010
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
      KAYAK_SANDBOX_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - run: npm ci
      # The inheritance proof executes actual shared-native transport readers.
      - run: npm --prefix apps/mobile ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run build
      - name: Verify the production build invokes the bot proxy
        run: |
          BOT_REQUIRE_EDGE=true npm run start -- --hostname 127.0.0.1 --port 3010 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { setTimeout } from 'node:timers/promises';
          const base = 'http://127.0.0.1:3010';
          let health;
          for (let attempt = 0; attempt < 60 && !health; attempt++) {
            health = await fetch(base + '/api/health').catch(() => null);
            if (!health) await setTimeout(500);
          }
          assert.equal(health?.status, 503);
          assert.equal((await health.json()).service, "kurioticket");
          for (const path of ['/', '/deals/results', '/favicon.ico', '/api/flights/search']) {
            const response = await fetch(base + path, {
              method: path.startsWith('/api/') ? 'POST' : 'GET',
              redirect: 'manual',
              headers: { 'X-Kurioticket-Edge-Auth': 'invalid' },
            });
            assert.equal(response.status, 403, path);
            assert.deepEqual(await response.json(), { error: 'Origin access denied.' });
          }
          NODE
      - run: npx --no-install tsc --noEmit --incremental false
      - run: npm run lint
      # Build first: mounted-browser tests consume its stable CSS output.
      - run: npm test -- --test-concurrency=4
      - run: npm run security:secrets
      - run: npm run check:conflicts
      - run: npm run check:migration-timestamps
