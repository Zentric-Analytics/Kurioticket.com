name: Preview release ledger

on:
  pull_request:
    branches: [dev]
    paths:
      - "services/preview-release/**"
      - ".github/workflows/preview-release-ledger.yml"

permissions:
  contents: read

jobs:
  postgres-ledger:
    name: PostgreSQL delivered-native state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: preview_release_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d preview_release_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PREVIEW_RELEASE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/preview_release_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix apps/mobile ci
      - run: npm run test:preview-release
