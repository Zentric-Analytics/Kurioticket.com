name: iOS Preview Build

on:
  workflow_call:
    inputs:
      target_sha: { description: "Trusted validated dev SHA", required: true, type: string }
      trigger_mode: { description: "Must be automatic", required: true, type: string }
    outputs:
      eas_build_id:
        description: "Finished iOS Preview build ID"
        value: ${{ jobs.build.outputs.eas_build_id }}
  workflow_dispatch:
    inputs:
      commit_sha: { description: "Exact approved dev commit SHA", required: true, type: string }
      action: { description: "Dry run or build", required: true, type: choice, options: [dry-run, build] }
      runtime_version: { description: "Expected runtime", required: true, type: string }
      expected_bundle_id: { description: "Expected iOS bundle identifier", required: true, type: string }
      expected_channel: { description: "Expected EAS channel", required: true, type: string }
      release_reason: { description: "Approval or change reference", required: true, type: string }
      confirmation_phrase: { description: "Type DELIVER IOS PREVIEW", required: true, type: string }

permissions: { contents: read }
concurrency: { group: ios-preview-build, cancel-in-progress: false }

jobs:
  build:
    environment: mobile-preview-build
    runs-on: ubuntu-latest
    outputs:
      eas_build_id: ${{ steps.result.outputs.eas_build_id }}
    env:
      APP_VARIANT: preview
      APP_BUILD_MODE: release
      EXPO_PUBLIC_API_BASE_URL: https://staging.kurioticket.com
      TARGET_SHA: ${{ github.event_name == 'workflow_call' && inputs.target_sha || inputs.commit_sha }}
      TRIGGER_MODE: ${{ github.event_name == 'workflow_call' && inputs.trigger_mode || 'manual' }}
    steps:
      - name: Capture audit start time
        run: echo "WORKFLOW_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with: { ref: "${{ github.event_name == 'workflow_call' && inputs.target_sha || inputs.commit_sha }}", fetch-depth: 0 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci
      - name: Validate immutable iOS Preview inputs
        working-directory: apps/mobile
        env:
          APPROVED_CONFIRMATION: "${{ inputs.confirmation_phrase }}"
          RELEASE_REASON: "${{ inputs.release_reason }}"
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'A full target SHA is required.' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$TARGET_SHA" || { echo 'Checked-out SHA does not match target.' >&2; exit 1; }
          git fetch origin dev --no-tags
          test "$(git rev-parse origin/dev)" = "$TARGET_SHA" || { echo 'Preview build target is no longer current dev.' >&2; exit 1; }
          if [ "$TRIGGER_MODE" = automatic ]; then
            test "${{ github.event_name }}" = workflow_call || { echo 'Automatic Preview build requires the trusted reusable workflow.' >&2; exit 1; }
          elif [ "${{ inputs.action }}" = build ]; then
            test "$APPROVED_CONFIRMATION" = 'DELIVER IOS PREVIEW' || { echo 'Confirmation phrase mismatch.' >&2; exit 1; }
            test "${{ inputs.runtime_version }}" = preview-0.3.0
            test "${{ inputs.expected_bundle_id }}" = com.kurioticket.app.preview
            test "${{ inputs.expected_channel }}" = preview
            test -n "${RELEASE_REASON//[[:space:]]/}"
          elif [ "${{ inputs.action }}" != dry-run ]; then
            echo 'Unsupported action.' >&2; exit 1
          fi
          echo "CHECKED_OUT_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
      - name: Validate release policy and resolved Preview configuration
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          npm run release:validate
          npx expo config --type public --json > "$RUNNER_TEMP/ios-preview-config.json"
          node - <<'NODE'
          const c = require(process.env.RUNNER_TEMP + '/ios-preview-config.json');
          const ok = c.name === 'Kurioticket Preview'
            && c.ios?.bundleIdentifier === 'com.kurioticket.app.preview'
            && c.version === '0.3.0'
            && c.runtimeVersion === 'preview-0.3.0'
            && c.extra?.environment?.channel === 'preview'
            && c.extra?.environment?.apiBaseUrl === 'https://staging.kurioticket.com'
            && c.ios?.infoPlist?.ITSAppUsesNonExemptEncryption === false;
          if (!ok) throw new Error('Resolved iOS Preview configuration mismatch');
          NODE
      - name: Verify staging safety
        run: |
          node - <<'NODE'
          const origin = 'https://staging.kurioticket.com';
          for (const path of ['/api/mobile/v1/health', '/api/mobile/v1/config']) {
            const response = await fetch(origin + path);
            if (!response.ok) throw new Error(`${path} returned HTTP ${response.status}`);
            const body = await response.json();
            if (body.data?.environment !== 'staging') throw new Error(`${path} is not staging`);
            if (body.data?.releaseReadiness?.sandboxTravelSafe !== true) throw new Error(`${path} travel safety is not ready`);
            if (body.data?.releaseReadiness?.emailPolicyRestricted !== true) throw new Error(`${path} email policy is not restricted`);
            if (body.data?.releaseReadiness?.commitSha !== process.env.TARGET_SHA) throw new Error(`${path} deployed SHA mismatch`);
            if (path.endsWith('/config') && body.data?.features?.externalCheckout !== false) throw new Error('External checkout is enabled');
          }
          NODE
      - name: Resolve remote iOS build number
        working-directory: apps/mobile
        env: { EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}" }
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || { echo 'Required environment EXPO_TOKEN is missing.' >&2; exit 1; }
          npx eas-cli@16.17.4 build:version:get --platform ios --profile preview --json --non-interactive > "$RUNNER_TEMP/ios-version.json" 2> "$RUNNER_TEMP/ios-version-error.txt"
          npx eas-cli@16.17.4 build:list --platform ios --build-profile preview --app-identifier com.kurioticket.app.preview --limit 50 --json --non-interactive > "$RUNNER_TEMP/ios-builds.json" 2> "$RUNNER_TEMP/ios-builds-error.txt"
          node - <<'NODE'
          const fs = require('fs');
          const version = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/ios-version.json', 'utf8'));
          const builds = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/ios-builds.json', 'utf8'));
          if (!/^\d+$/.test(String(version.buildNumber ?? ''))) throw new Error('Remote iOS build number is malformed');
          if (!Array.isArray(builds)) throw new Error('iOS build history is malformed');
          for (const b of builds) {
            if (b.platform !== 'IOS' || b.buildProfile !== 'preview' || b.project?.id !== '89f6fd88-c0d7-495a-9e2b-8301b09f407d') throw new Error('iOS build history identity mismatch');
          }
          const current = Number(version.buildNumber);
          const evidence = { currentBuildNumber: current, proposedBuildNumber: current + 1, historyCount: builds.length };
          fs.writeFileSync(process.env.RUNNER_TEMP + '/ios-version-evidence.json', JSON.stringify(evidence, null, 2) + '\n');
          console.log(`Current remote iOS build number: ${current}; proposed next build number: ${current + 1}`);
          NODE
      - name: Verify Preview iOS OAuth configuration
        working-directory: apps/mobile
        env: { EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}" }
        run: |
          set -euo pipefail
          npx eas-cli@16.17.4 env:list preview --format short > "$RUNNER_TEMP/ios-preview-environment.txt"
          grep -q '^EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=' "$RUNNER_TEMP/ios-preview-environment.txt" || {
            echo 'Preview iOS OAuth client ID is not configured in the EAS Preview environment.' >&2
            exit 1
          }
      - name: Report non-mutating dry-run result
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'dry-run'
        run: |
          echo 'READY TO SUBMIT IOS PREVIEW BUILD'
          echo 'submissionPerformed: false'
      - name: Build approved iOS Preview IPA
        if: github.event_name == 'workflow_call' || inputs.action == 'build'
        working-directory: apps/mobile
        env: { EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}" }
        run: |
          set -euo pipefail
          npx eas-cli@16.17.4 build --platform ios --profile preview --non-interactive --freeze-credentials --json 2> >(tee "$RUNNER_TEMP/ios-build-error.txt" >&2) | tee "$RUNNER_TEMP/ios-build-result.json"
      - name: Verify finished iOS Preview result
        id: result
        if: github.event_name == 'workflow_call' || inputs.action == 'build'
        working-directory: apps/mobile
        env: { EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}" }
        run: |
          set -euo pipefail
          BUILD_ID=$(node -e "const x=require(process.env.RUNNER_TEMP+'/ios-build-result.json');if(!Array.isArray(x)||x.length!==1||!x[0]?.id)throw Error('iOS Preview build submission result is malformed');process.stdout.write(x[0].id)")
          npx eas-cli@16.17.4 build:view "$BUILD_ID" --json > "$RUNNER_TEMP/finished-ios-preview-build.json"
          node - <<'NODE'
          const fs = require('fs');
          const b = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/finished-ios-preview-build.json', 'utf8'));
          if (b?.status !== 'FINISHED' || b?.platform !== 'IOS' || b?.gitCommitHash !== process.env.TARGET_SHA) throw new Error('iOS Preview build result is incomplete or identity-mismatched.');
          if ((b.applicationIdentifier ?? b.appIdentifier) !== 'com.kurioticket.app.preview' || b.runtimeVersion !== 'preview-0.3.0' || b.channel !== 'preview' || b.buildProfile !== 'preview') throw new Error('iOS Preview build identity mismatch.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `eas_build_id=${b.id}\n`);
          NODE
      - name: Upload automatic iOS Preview build to TestFlight
        if: github.event_name == 'workflow_call'
        working-directory: apps/mobile
        env: { EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}" }
        run: npx eas-cli@16.17.4 submit --platform ios --id "${{ steps.result.outputs.eas_build_id }}" --profile preview --non-interactive --no-wait | tee "$RUNNER_TEMP/ios-submit-result.txt"
      - name: Preserve non-secret iOS Preview evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ios-preview-build-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ios-preview-config.json
            ${{ runner.temp }}/ios-version-evidence.json
            ${{ runner.temp }}/ios-build-result.json
            ${{ runner.temp }}/ios-submit-result.txt
          if-no-files-found: warn
          retention-days: 90
