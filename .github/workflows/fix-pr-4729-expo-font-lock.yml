name: Temporary PR 4729 expo-font lock fix

on:
  push:
    branches:
      - codex/add-inter-typography-to-native-flight-results
    paths:
      - .github/workflows/fix-pr-4729-expo-font-lock.yml

permissions:
  contents: write

jobs:
  dedupe-lockfile:
    if: github.event.head_commit.message == 'Bootstrap PR 4729 expo-font lock fix'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Normalize mobile lockfile
        shell: bash
        run: |
          set -euo pipefail
          cd apps/mobile
          npm install --package-lock-only --ignore-scripts --prefer-dedupe
          npm dedupe --package-lock-only --ignore-scripts

      - name: Verify dependency contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('apps/mobile/package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('apps/mobile/package-lock.json', 'utf8'));
          const expected = {
            expo: '~54.0.37',
            'expo-font': '~14.0.12',
            '@expo-google-fonts/inter': '^0.4.2',
          };
          for (const [name, version] of Object.entries(expected)) {
            if (pkg.dependencies?.[name] !== version) {
              throw new Error(`Unexpected ${name} version: ${pkg.dependencies?.[name]}`);
            }
          }
          const top = lock.packages?.['node_modules/expo-font'];
          if (!top || top.version !== '14.0.12') {
            throw new Error('Top-level expo-font@14.0.12 is missing');
          }
          if (lock.packages?.['node_modules/expo/node_modules/expo-font']) {
            throw new Error('Nested expo/node_modules/expo-font still exists');
          }
          NODE
          git diff --exit-code -- apps/mobile/package.json

      - name: Verify clean install and release gate
        shell: bash
        run: |
          set -euo pipefail
          cd apps/mobile
          rm -rf node_modules
          npm ci --ignore-scripts
          npm ls expo-font --all
          npm run release:validate

      - name: Commit normalized lockfile
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          if git diff --quiet -- apps/mobile/package-lock.json; then
            echo 'Expected package-lock.json to change, but it did not.' >&2
            exit 1
          fi
          git diff --exit-code -- apps/mobile/package.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/package-lock.json
          git commit -m 'Deduplicate native expo-font dependency'
          git push origin HEAD:"${GITHUB_REF_NAME}"
