name: Patch curated Cars readable details

on:
  push:
    branches:
      - chatgpt/fix-curated-cars-rear-left
    paths:
      - .github/workflows/patch-curated-cars-readable-details.yml

permissions:
  contents: write

jobs:
  correct-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-curated-cars-rear-left
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Rebuild rear-left assets from current dev
        run: |
          git checkout origin/dev -- public/images/cars/results src/lib/cars/carResultImage.ts src/lib/cars/carResultImage.test.ts
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import json, shutil

          root = Path('public/images/cars/results')
          audit = Path('/tmp/cars-rear-left-final-audit')
          final_assets = audit / 'final-assets'
          final_assets.mkdir(parents=True, exist_ok=True)

          names = sorted(p.name for p in root.glob('*.webp'))
          assert len(names) == 30, names

          # Source-coordinate patches retained unmirrored after the whole vehicle is flipped.
          # They keep legible model plates and directional/lettered badges readable.
          patches = {
            'audi-a4.webp': [(245,520,455,595)],
            'citroen-grand-c4-spacetourer.webp': [(235,515,405,570)],
            'dacia-duster.webp': [(245,515,455,575),(330,420,390,465)],
            'fiat-500.webp': [(300,545,455,600),(355,470,395,515)],
            'ford-focus.webp': [(200,535,395,595),(250,470,315,510)],
            'ford-tourneo.webp': [(235,530,405,590),(335,435,400,480)],
            'honda-civic.webp': [(185,520,415,580),(305,455,350,510)],
            'hyundai-i20.webp': [(245,520,425,580),(330,465,395,515)],
            'hyundai-tucson.webp': [(245,525,455,590),(330,445,400,505)],
            'kia-sportage.webp': [(270,370,345,410)],
            'mercedes-benz-c-class.webp': [(245,550,445,615)],
            'mercedes-benz-e-class.webp': [(225,555,410,615)],
            'mercedes-benz-v-class.webp': [(275,545,430,610)],
            'nissan-qashqai.webp': [(205,425,255,475)],
            'opel-corsa.webp': [(300,525,500,590),(390,460,435,510)],
            'peugeot-208.webp': [(318,428,382,461),(290,535,375,586)],
            'peugeot-3008.webp': [(220,515,425,580),(325,430,390,490)],
            'renault-captur.webp': [(300,515,480,585)],
            'skoda-octavia.webp': [(227,574,388,619)],
            'toyota-camry.webp': [(245,525,405,590)],
            'toyota-corolla.webp': [(225,530,425,595)],
            'toyota-yaris.webp': [(280,530,435,605)],
            'volkswagen-golf.webp': [(235,530,405,600)],
            'volvo-xc60.webp': [(205,530,410,600),(285,425,365,500)],
          }

          final = {}
          manifest = []
          for name in names:
            path = root / name
            original = Image.open(path).convert('RGBA')
            assert original.size == (1400, 900), f'{name}: size {original.size}'
            saved = [(box, original.crop(box)) for box in patches.get(name, [])]
            image = original.transpose(Image.Transpose.FLIP_LEFT_RIGHT)
            for box, patch in saved:
              x0,y0,x1,y1 = box
              image.paste(patch, (1400-x1, y0))
            image.save(path, 'WEBP', quality=95, method=6)
            verified = Image.open(path).convert('RGBA')
            assert verified.size == (1400,900)
            lo, hi = verified.getchannel('A').getextrema()
            assert (lo,hi) == (0,255), f'{name}: alpha {(lo,hi)}'
            for corner in ((0,0),(1399,0),(0,899),(1399,899)):
              assert verified.getpixel(corner)[3] == 0, f'{name}: opaque corner {corner}'
            final[name] = verified.copy()
            shutil.copy2(path, final_assets / name)
            manifest.append({'name':name,'width':1400,'height':900,'patches':patches.get(name,[])})

          cols, rows, cw, ch = 5, 6, 300, 220
          sheet = Image.new('RGB', (cols*cw, rows*ch), 'white')
          draw = ImageDraw.Draw(sheet)
          font = ImageFont.load_default()
          for i,name in enumerate(names):
            r,c = divmod(i,cols)
            x,y = c*cw,r*ch
            canvas = Image.new('RGBA',(cw,ch-28),(245,247,250,255))
            car = final[name].copy()
            car.thumbnail((cw-16,ch-42),Image.Resampling.LANCZOS)
            canvas.alpha_composite(car,((canvas.width-car.width)//2,(canvas.height-car.height)//2))
            sheet.paste(canvas.convert('RGB'),(x,y))
            draw.text((x+8,y+ch-22),name.removesuffix('.webp'),fill='black',font=font)
          sheet.save(audit/'final-contact-sheet.png')
          (audit/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')

          source = Path('src/lib/cars/carResultImage.ts')
          test = Path('src/lib/cars/carResultImage.test.ts')
          old = 'front-left-cutouts-20260914'
          new = 'rear-left-cutouts-20260914-v2'
          source_text = source.read_text(); test_text = test.read_text()
          assert source_text.count(old) == 1
          assert test_text.count(old) == 2
          source.write_text(source_text.replace(old,new))
          test.write_text(test_text.replace(old,new))
          PY
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Run focused image contract
        run: npx cross-env JITI_TSCONFIG_PATHS=./tsconfig.json node --test --import jiti/register src/lib/cars/carResultImage.test.ts

      - uses: actions/upload-artifact@v4
        with:
          name: cars-rear-left-final-audit
          path: /tmp/cars-rear-left-final-audit
          if-no-files-found: error

      - name: Commit final corrected assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/cars/results/*.webp src/lib/cars/carResultImage.ts src/lib/cars/carResultImage.test.ts
          git commit -m 'Preserve readable details on rear-left Cars assets'
          git push origin HEAD:chatgpt/fix-curated-cars-rear-left
