name: Validate mobile production

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-production-update.yml"
  workflow_dispatch:

concurrency:
  group: mobile-production-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-production:
    name: Validate mobile production
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: production
      APP_BUILD_MODE: release
      EXPO_PUBLIC_API_BASE_URL: https://kurioticket.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Type-check mobile app
        working-directory: apps/mobile
        run: npm run typecheck

      - name: Test mobile app
        working-directory: apps/mobile
        run: npm test

      - name: Validate Expo project
        working-directory: apps/mobile
        run: npm run expo:doctor

      - name: Resolve Production public configuration
        working-directory: apps/mobile
        run: npx expo config --type public --json > /tmp/kurioticket-production-public.json

      - name: Validate Production iOS prebuild configuration
        working-directory: apps/mobile
        run: npx expo config --type prebuild --json > /tmp/kurioticket-production-prebuild.json

      - name: Confirm delivery remains gated
        run: echo "Validation complete. EAS Updates and native builds require a separately approved workflow."
