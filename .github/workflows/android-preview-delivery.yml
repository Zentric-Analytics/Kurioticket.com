name: Android Preview Delivery

on:
  workflow_dispatch:
    inputs:
      commit_sha: { description: "Exact approved dev commit SHA", required: true, type: string }
      platform: { description: "Must be android", required: true, type: choice, options: [android] }
      action: { description: "Approved delivery action", required: true, type: choice, options: [build, update] }
      runtime_version: { description: "Expected runtime", required: true, type: string }
      release_reason: { description: "Approval or change reference", required: true, type: string }
      confirmation_phrase: { description: "Type DELIVER ANDROID PREVIEW", required: true, type: string }
      expected_package: { description: "Expected Android package", required: true, type: string }
      expected_channel: { description: "Expected EAS channel", required: true, type: string }
      baseline_eas_build_id: { description: "Approved EAS build UUID for update; NONE for build", required: true, type: string }

permissions: { contents: read }
concurrency: { group: android-preview-delivery, cancel-in-progress: false }

jobs:
  deliver:
    environment: mobile-preview
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: preview
      APP_BUILD_MODE: release
      EXPO_PUBLIC_API_BASE_URL: https://staging.kurioticket.com
      EAS_NO_VCS: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with: { ref: "${{ inputs.commit_sha }}", fetch-depth: 0 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci
      - name: Validate immutable Preview inputs
        working-directory: apps/mobile
        env:
          APPROVED_SHA: "${{ inputs.commit_sha }}"
          APPROVED_RUNTIME: "${{ inputs.runtime_version }}"
          APPROVED_PACKAGE: "${{ inputs.expected_package }}"
          APPROVED_CHANNEL: "${{ inputs.expected_channel }}"
          APPROVED_CONFIRMATION: "${{ inputs.confirmation_phrase }}"
          DELIVERY_ACTION: "${{ inputs.action }}"
          RELEASE_REASON: "${{ inputs.release_reason }}"
          BASELINE_EAS_BUILD_ID: "${{ inputs.baseline_eas_build_id }}"
        run: node scripts/validate-delivery-inputs.mjs preview "$APPROVED_SHA" "$APPROVED_RUNTIME" "$APPROVED_PACKAGE" "$APPROVED_CHANNEL" preview https://staging.kurioticket.com "$APPROVED_CONFIRMATION" branch "$DELIVERY_ACTION" "$RELEASE_REASON" "$BASELINE_EAS_BUILD_ID"
      - name: Validate release matrix and resolved config
        working-directory: apps/mobile
        run: |
          npm run release:validate
          npx expo config --type public --json > "$RUNNER_TEMP/preview-config.json"
          node -e "const c=require(process.env.RUNNER_TEMP+'/preview-config.json');if(c.android.package!=='com.kurioticket.app.preview'||c.runtimeVersion!=='preview-0.3.0'||c.extra.environment.channel!=='preview'||c.extra.environment.apiBaseUrl!=='https://staging.kurioticket.com')throw Error('Preview configuration mismatch')"
      - name: Resolve approved binary baseline
        if: inputs.action == 'update'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}"
          BASELINE_EAS_BUILD_ID: "${{ inputs.baseline_eas_build_id }}"
        run: |
          test -n "$EXPO_TOKEN" || { echo 'Required environment EXPO_TOKEN is missing.' >&2; exit 1; }
          test -f release-baselines/android/preview.json || { echo 'Reviewed Preview binary manifest is missing.' >&2; exit 1; }
          npx eas-cli@16.17.4 build:view "$BASELINE_EAS_BUILD_ID" --json --non-interactive > "$RUNNER_TEMP/baseline-build.json"
          node scripts/verify-release-evidence.mjs --kind baseline --variant preview --manifest release-baselines/android/preview.json --build "$RUNNER_TEMP/baseline-build.json" --output "$RUNNER_TEMP/baseline-evidence.json"
      - name: Classify native versus OTA delivery
        working-directory: apps/mobile
        env:
          APPROVED_SHA: "${{ inputs.commit_sha }}"
          DELIVERY_ACTION: "${{ inputs.action }}"
        run: |
          npx fingerprint fingerprint:generate --platform android > "$RUNNER_TEMP/current-fingerprint.json"
          if [ "$DELIVERY_ACTION" = update ]; then
            BASE=$(node -e "const x=require(process.env.RUNNER_TEMP+'/baseline-evidence.json');process.stdout.write(x.commitSha)")
            BASE_FP=$(node -e "const x=require(process.env.RUNNER_TEMP+'/baseline-evidence.json');process.stdout.write(x.nativeFingerprint)")
          else BASE="$APPROVED_SHA"; BASE_FP=BUILD_ACTION;
          fi
          CURRENT_FP=$(node -e "const x=require(process.env.RUNNER_TEMP+'/current-fingerprint.json');process.stdout.write(x.hash)")
          node scripts/classify-release.mjs --variant preview --base "$BASE" --head "$APPROVED_SHA" --baseline-fingerprint "$BASE_FP" --current-fingerprint "$CURRENT_FP" --runtime preview-0.3.0 --channel preview --action "$DELIVERY_ACTION" | tee "$RUNNER_TEMP/release-classification.json"
      - name: Verify live channel mapping
        if: inputs.action == 'update'
        working-directory: apps/mobile
        env: { EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}" }
        run: |
          test -n "$EXPO_TOKEN" || { echo 'Required environment EXPO_TOKEN is missing.' >&2; exit 1; }
          npx eas-cli@16.17.4 channel:view preview --json --non-interactive > "$RUNNER_TEMP/channel.json"
          node scripts/verify-release-evidence.mjs --kind channel --variant preview --input "$RUNNER_TEMP/channel.json" --output "$RUNNER_TEMP/channel-evidence.json"
      - name: Report proposed remote Android version code
        if: inputs.action == 'build'
        working-directory: apps/mobile
        env: { EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}" }
        run: |
          test -n "$EXPO_TOKEN" || { echo 'Required environment EXPO_TOKEN is missing.' >&2; exit 1; }
          VERSION_OUTPUT=$(npx eas-cli@16.17.4 build:version:get --platform android --profile preview --non-interactive)
          CURRENT=$(printf '%s' "$VERSION_OUTPUT" | sed -nE 's/.*versionCode[^0-9]*([0-9]+).*/\1/ip' | tail -1)
          test -n "$CURRENT" || { echo 'Unable to parse EAS remote versionCode.' >&2; exit 1; }
          CURRENT="$CURRENT" node -e "const fs=require('fs');const current=Number(process.env.CURRENT);fs.writeFileSync(process.env.RUNNER_TEMP+'/version-evidence.json',JSON.stringify({currentRemoteVersionCode:current,proposedVersionCode:current+1,playRecordStatus:'not-applicable-preview'},null,2)+'\n')"
      - name: Build approved Preview APK
        if: inputs.action == 'build'
        working-directory: apps/mobile
        env: { EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}" }
        run: |
          test -n "$EXPO_TOKEN" || { echo 'Required environment EXPO_TOKEN is missing.' >&2; exit 1; }
          npx eas-cli@16.17.4 build --platform android --profile preview --non-interactive --json | tee "$RUNNER_TEMP/delivery-result.json"
      - name: Publish approved Preview OTA through verified channel
        if: inputs.action == 'update'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}"
          RELEASE_REASON: "${{ inputs.release_reason }}"
        run: |
          test -n "$EXPO_TOKEN" || { echo 'Required environment EXPO_TOKEN is missing.' >&2; exit 1; }
          npx eas-cli@16.17.4 update --channel preview --platform android --message "$RELEASE_REASON" --non-interactive --json | tee "$RUNNER_TEMP/delivery-result.json"
      - name: Write consolidated release audit
        if: always()
        working-directory: apps/mobile
        env:
          WORKFLOW_RUN_ID: "${{ github.run_id }}"
          RELEASE_ACTOR: "${{ github.actor }}"
          RELEASE_ENVIRONMENT: preview
          RELEASE_ACTION: "${{ inputs.action }}"
          RELEASE_REASON: "${{ inputs.release_reason }}"
          RELEASE_COMMIT: "${{ inputs.commit_sha }}"
          RELEASE_PACKAGE: com.kurioticket.app.preview
          RELEASE_PROFILE: preview
          RELEASE_RUNTIME: preview-0.3.0
          RELEASE_CHANNEL: preview
          BASELINE_EAS_BUILD_ID: "${{ inputs.baseline_eas_build_id }}"
          BASELINE_EVIDENCE_PATH: "${{ runner.temp }}/baseline-evidence.json"
          CHANNEL_EVIDENCE_PATH: "${{ runner.temp }}/channel-evidence.json"
          CURRENT_FINGERPRINT_PATH: "${{ runner.temp }}/current-fingerprint.json"
          CLASSIFIER_PATH: "${{ runner.temp }}/release-classification.json"
          VERSION_EVIDENCE_PATH: "${{ runner.temp }}/version-evidence.json"
          DELIVERY_RESULT_PATH: "${{ runner.temp }}/delivery-result.json"
          AUDIT_OUTPUT: "${{ runner.temp }}/release-audit.json"
          WORKFLOW_STARTED_AT: "${{ github.event.repository.updated_at }}"
          FINAL_STATUS: "${{ job.status }}"
        run: node scripts/write-release-audit.mjs
      - name: Preserve non-secret release evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-preview-release-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/release-audit.json
          if-no-files-found: error
          retention-days: 365
