name: PR 5272 repair

on:
  push:
    branches:
      - codex/hotel-stay-card-editable

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/hotel-stay-card-editable
          fetch-depth: 0

      - name: Merge latest dev and resolve superseded hotel mobile overlaps
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin dev
          git merge --no-commit --no-ff origin/dev || true

          # Latest dev has already replaced the old inline Details stay editors
          # with HotelStayEditor. Keep that newer approved implementation rather
          # than reintroducing the superseded picker/save path from this PR.
          git checkout origin/dev -- \
            apps/mobile/src/features/flow/HotelSearchPanel.tsx \
            apps/mobile/src/features/flow/hotelGuestsRoomsPicker.test.ts \
            apps/mobile/src/features/search/ApprovedDetailScreen.tsx \
            apps/mobile/src/features/search/nativeHotelDetails.test.ts \
            apps/mobile/src/features/search/nativeHotelDetailsModel.ts \
            apps/mobile/src/features/search/nativeHotelIdentityGalleryParity.test.ts

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "Unresolved merge conflicts:"
            echo "$unresolved"
            exit 1
          fi

          # The two server hotel-details files are PR-owned and intentionally
          # remain on top of dev so static details return the requested-stay
          # pricing rather than a stale cached total.
          git add -A
          git diff --cached --check
          git commit -m "Merge latest dev into PR 5272 and keep current hotel stay editor"
          git push origin HEAD:codex/hotel-stay-card-editable

      - name: Install root dependencies
        run: npm ci

      - name: Validate hotel details server pricing contract
        run: npx cross-env JITI_TSCONFIG_PATHS=true node --test --import jiti/register src/app/api/hotels/details/route.test.ts

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Typecheck mobile
        working-directory: apps/mobile
        run: npm run typecheck

      - name: Run focused hotel stay regressions
        working-directory: apps/mobile
        run: node --test --require ./testAssetSetup.cjs --import jiti/register src/features/search/hotelStayEditorModalParity.test.ts src/features/search/nativeHotelDetails.test.ts src/features/search/nativeHotelIdentityGalleryParity.test.ts src/features/flow/hotelGuestsRoomsPicker.test.ts

      - name: Run full mobile suite
        working-directory: apps/mobile
        run: npm test

      - name: Validate repository conflicts and diff
        run: |
          npm run check:conflicts
          git diff --check origin/dev...HEAD
