name: PR 5012 conflict fix

on:
  push:
    branches:
      - codex/align-flight-results-filter-behavior

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/align-flight-results-filter-behavior
          fetch-depth: 0

      - name: Merge latest dev and resolve overlapping flight changes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "25fabec1b3f94053506b135af013c8c9b5d6e291" || test "$(git rev-parse HEAD^)" = "25fabec1b3f94053506b135af013c8c9b5d6e291"
          git fetch origin dev
          set +e
          git merge --no-commit --no-ff origin/dev
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            printf 'Merge conflicts:\n%s\n' "$conflicts"
            unexpected="$(printf '%s\n' "$conflicts" | grep -Ev '^(apps/mobile/src/features/search/ApprovedResultsScreen.tsx|apps/mobile/src/features/search/flightResultsPagination.test.ts|apps/mobile/src/features/search/flightSortExperience.test.ts)$' || true)"
            test -z "$unexpected"
          fi

          git checkout origin/dev -- \
            apps/mobile/src/features/search/ApprovedResultsScreen.tsx \
            apps/mobile/src/features/search/flightResultsPagination.test.ts \
            apps/mobile/src/features/search/flightSortExperience.test.ts

          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          screen_path = Path("apps/mobile/src/features/search/ApprovedResultsScreen.tsx")
          screen = screen_path.read_text()

          old = '''  const handleFlightFiltersChange = useCallback((next: FlightFilters) => {
            cancelFlightPagination();
            setFlightPage(1);
            setFilters(next);
          }, [cancelFlightPagination]);'''
          new = '''  const handleFullFlightFiltersChange = useCallback((next: FlightFilters) => {
            cancelFlightPagination();
            setFlightPage(1);
            setFilters(next);
          }, [cancelFlightPagination]);
          const handleQuickFlightFiltersChange = useCallback((next: FlightFilters) => {
            cancelFlightPagination();
            setFilters(next);
          }, [cancelFlightPagination]);'''
          screen = replace_once(screen, old, new, "split full and quick filter handlers")

          old = '''  const clearFlightFilters = useCallback(() => {
            cancelFlightPagination();
            setFlightPage(1);
            setFilters(emptyFlightFilters());
          }, [cancelFlightPagination]);'''
          new = old + '''
          const scrollToFlightResultsBeginning = useCallback(() => {
            requestAnimationFrame(() => {
              try {
                flightResultsListRef.current?.scrollToLocation({ sectionIndex: 0, itemIndex: 0, viewPosition: 0, animated: true });
              } catch (error) {
                if (__DEV__) console.warn("[flight-results:filter-complete-scroll]", error);
                try {
                  flightResultsListRef.current?.scrollToLocation({ sectionIndex: 0, itemIndex: 0, viewPosition: 0, animated: false });
                } catch (fallbackError) {
                  if (__DEV__) console.warn("[flight-results:filter-complete-scroll-fallback]", fallbackError);
                }
              }
            });
          }, []);
          const completeFullFlightFilters = useCallback(() => {
            setFilterOpen(false);
            scrollToFlightResultsBeginning();
          }, [scrollToFlightResultsBeginning]);'''
          screen = replace_once(screen, old, new, "add full-filter completion scroll")

          screen = replace_once(
              screen,
              '      stopsActive={filters.maxStops != null}',
              '      stopsCount={filters.stops?.length || Number(filters.maxStops != null)}',
              "update stops quick-control count",
          )
          screen = replace_once(
              screen,
              '<FlightSortSheet visible={sortOpen} sort={sort} onApply={(next) => { cancelFlightPagination(); setFlightPage(1); setSort(next); setSortOpen(false); }} onClose={() => setSortOpen(false)} />',
              '<FlightSortSheet visible={sortOpen} sort={sort} onApply={(next) => { cancelFlightPagination(); setSort(next); setSortOpen(false); }} onClose={() => setSortOpen(false)} />',
              "preserve valid page on quick sort",
          )
          screen = replace_once(
              screen,
              '''            onChange={handleFlightFiltersChange}
            onClose={() => setFilterOpen(false)}''',
              '''            onChange={filterSection === "all" ? handleFullFlightFiltersChange : handleQuickFlightFiltersChange}
            onClose={() => setFilterOpen(false)}
            onComplete={completeFullFlightFilters}''',
              "wire full versus quick filter behavior",
          )
          screen_path.write_text(screen)

          pagination_path = Path("apps/mobile/src/features/search/flightResultsPagination.test.ts")
          pagination = pagination_path.read_text()
          old = '''test("Flight page resets are scoped to filters, clear, sort, and search identity", () => {
            assert.match(screen, /previousFlightSearchKey\\.current !== plan\\.plan\\.key[\\s\\S]*?setFlightPage\\(1\\)/);
            assert.match(screen, /handleFlightFiltersChange[\\s\\S]*?setFlightPage\\(1\\)[\\s\\S]*?setFilters\\(next\\)/);
            assert.match(screen, /clearFlightFilters[\\s\\S]*?setFlightPage\\(1\\)[\\s\\S]*?setFilters\\(emptyFlightFilters\\(\\)\\)/);
            assert.match(screen, /<FlightSortSheet[\\s\\S]*?onApply=\\{\\(next\\) => \\{ cancelFlightPagination\\(\\); setFlightPage\\(1\\); setSort\\(next\\)/);
            assert.match(screen, /flightPage === clampedFlightPage\\) return;[\\s\\S]*?cancelFlightPagination\\(\\);[\\s\\S]*?setFlightPage\\(clampedFlightPage\\)/);
          });'''
          new = '''test("full filters and search identity reset while quick filters and sort preserve then clamp the page", () => {
            assert.match(screen, /previousFlightSearchKey\\.current !== plan\\.plan\\.key[\\s\\S]*?setFlightPage\\(1\\)/);
            assert.match(screen, /handleFullFlightFiltersChange[\\s\\S]*?cancelFlightPagination\\(\\)[\\s\\S]*?setFlightPage\\(1\\)[\\s\\S]*?setFilters\\(next\\)/);
            assert.match(screen, /handleQuickFlightFiltersChange[\\s\\S]*?cancelFlightPagination\\(\\)[\\s\\S]*?setFilters\\(next\\)/);
            const quickFilter = screen.slice(screen.indexOf("const handleQuickFlightFiltersChange"), screen.indexOf("const clearFlightFilters"));
            assert.doesNotMatch(quickFilter, /setFlightPage/);
            assert.match(screen, /clearFlightFilters[\\s\\S]*?cancelFlightPagination\\(\\)[\\s\\S]*?setFlightPage\\(1\\)[\\s\\S]*?setFilters\\(emptyFlightFilters\\(\\)\\)/);
            assert.match(screen, /<FlightSortSheet[\\s\\S]*?onApply=\\{\\(next\\) => \\{ cancelFlightPagination\\(\\); setSort\\(next\\); setSortOpen\\(false\\); \\}\\}/);
            const sortBinding = screen.slice(screen.indexOf("<FlightSortSheet"), screen.indexOf("<FlightFilterSheet"));
            assert.doesNotMatch(sortBinding, /setFlightPage\\(1\\)/);
            assert.match(screen, /onChange=\\{filterSection === "all" \\? handleFullFlightFiltersChange : handleQuickFlightFiltersChange\\}/);
            assert.match(screen, /flightPage === clampedFlightPage\\) return;[\\s\\S]*?cancelFlightPagination\\(\\);[\\s\\S]*?setFlightPage\\(clampedFlightPage\\)/);
          });'''
          pagination = replace_once(pagination, old, new, "update page reset behavior test")
          pagination = pagination.replace('screen.indexOf("const handleFlightFiltersChange")', 'screen.indexOf("const handleFullFlightFiltersChange")')

          old = '''test("Flight pagination resets cancel an active transition and do not route or search", () => {
            const cancellation = screen.slice(screen.indexOf("const cancelFlightPagination"), screen.indexOf("useEffect(() => () =>", screen.indexOf("const cancelFlightPagination")));
            assert.match(cancellation, /flightPaginationTransitionRef\\.current \\+= 1/);
            assert.match(cancellation, /clearFlightPaginationTimers\\(\\)/);
            assert.match(cancellation, /setFlightPaginationPendingPage\\(null\\)/);
            assert.match(screen, /handleFlightFiltersChange[\\s\\S]*cancelFlightPagination\\(\\)[\\s\\S]*setFlightPage\\(1\\)/);
            assert.match(screen, /clearFlightFilters[\\s\\S]*cancelFlightPagination\\(\\)[\\s\\S]*setFlightPage\\(1\\)/);
            assert.match(screen, /onApply=\\{\\(next\\) => \\{ cancelFlightPagination\\(\\); setFlightPage\\(1\\); setSort/);
            assert.doesNotMatch(screen.slice(screen.indexOf("const changeFlightPage"), screen.indexOf("const handleFullFlightFiltersChange")), /searchFlights|setRetry|router\\.(?:setParams|push|replace)/);
          });'''
          new = '''test("Flight pagination resets cancel an active transition and do not route or search", () => {
            const cancellation = screen.slice(screen.indexOf("const cancelFlightPagination"), screen.indexOf("useEffect(() => () =>", screen.indexOf("const cancelFlightPagination")));
            assert.match(cancellation, /flightPaginationTransitionRef\\.current \\+= 1/);
            assert.match(cancellation, /clearFlightPaginationTimers\\(\\)/);
            assert.match(cancellation, /setFlightPaginationPendingPage\\(null\\)/);
            assert.match(screen, /handleFullFlightFiltersChange[\\s\\S]*cancelFlightPagination\\(\\)[\\s\\S]*setFlightPage\\(1\\)/);
            assert.match(screen, /handleQuickFlightFiltersChange[\\s\\S]*cancelFlightPagination\\(\\)[\\s\\S]*setFilters\\(next\\)/);
            assert.match(screen, /clearFlightFilters[\\s\\S]*cancelFlightPagination\\(\\)[\\s\\S]*setFlightPage\\(1\\)/);
            assert.match(screen, /onApply=\\{\\(next\\) => \\{ cancelFlightPagination\\(\\); setSort/);
            assert.doesNotMatch(screen.slice(screen.indexOf("const changeFlightPage"), screen.indexOf("const handleFullFlightFiltersChange")), /searchFlights|setRetry|router\\.(?:setParams|push|replace)/);
          });'''
          pagination = replace_once(pagination, old, new, "update pagination cancellation test")
          pagination += '''

          test("only completing the full Filter closes and scrolls to the results item geometry", () => {
            assert.match(screen, /completeFullFlightFilters[\\s\\S]*?setFilterOpen\\(false\\)[\\s\\S]*?scrollToFlightResultsBeginning\\(\\)/);
            assert.match(screen, /scrollToFlightResultsBeginning[\\s\\S]*?scrollToLocation\\(\\{ sectionIndex: 0, itemIndex: 0, viewPosition: 0, animated: true \\}\\)/);
            assert.match(screen, /onClose=\\{\\(\\) => setFilterOpen\\(false\\)\\}[\\s\\S]*?onComplete=\\{completeFullFlightFilters\\}/);
            const completion = screen.slice(screen.indexOf("const scrollToFlightResultsBeginning"), screen.indexOf("const canonicalHotelDestination"));
            assert.doesNotMatch(completion, /setFlightPaginationPendingPage|setFlightPage|travelApi\\.searchFlights|setRetry/);
          });
          '''
          pagination_path.write_text(pagination)

          sort_path = Path("apps/mobile/src/features/search/flightSortExperience.test.ts")
          sort_test = sort_path.read_text()
          old = '''test("sort changes apply immediately like web mobile", () => {
            assert.doesNotMatch(sheet, /draft|setDraft|Apply sort/);
            assert.match(sheet, /onPress=\\{\\(\\) => onApply\\(option\\.value\\)\\}/);
            assert.match(screen, /onApply=\\{\\(next\\) => \\{ cancelFlightPagination\\(\\); setFlightPage\\(1\\); setSort\\(next\\); setSortOpen\\(false\\); \\}\\}/);
          });'''
          new = '''test("sort changes apply immediately without resetting the current results page", () => {
            assert.doesNotMatch(sheet, /draft|setDraft|Apply sort/);
            assert.match(sheet, /onPress=\\{\\(\\) => onApply\\(option\\.value\\)\\}/);
            assert.match(screen, /onApply=\\{\\(next\\) => \\{ cancelFlightPagination\\(\\); setSort\\(next\\); setSortOpen\\(false\\); \\}\\}/);
            const sortBinding = screen.slice(screen.indexOf("<FlightSortSheet"), screen.indexOf("<FlightFilterSheet"));
            assert.doesNotMatch(sortBinding, /setFlightPage\\(1\\)/);
          });'''
          sort_test = replace_once(sort_test, old, new, "update sort page-preservation test")
          sort_path.write_text(sort_test)
          PY

          git add apps/mobile/src/features/search/ApprovedResultsScreen.tsx \
            apps/mobile/src/features/search/flightResultsPagination.test.ts \
            apps/mobile/src/features/search/flightSortExperience.test.ts
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Type-check mobile app
        working-directory: apps/mobile
        run: npm run typecheck

      - name: Run focused filter and pagination tests
        working-directory: apps/mobile
        run: node --test --require ./testAssetSetup.cjs --import jiti/register src/features/search/FlightFilterSheet.test.ts src/features/search/flightFilters.test.ts src/features/search/flightResultsPagination.test.ts src/features/search/flightResultsQuickControls.test.ts src/features/search/flightSortExperience.test.ts

      - name: Commit resolved merge and remove helper
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr5012-conflict-fix.yml
          git add -A
          git commit -m 'Merge dev into codex/align-flight-results-filter-behavior'
          git push origin HEAD:codex/align-flight-results-filter-behavior
