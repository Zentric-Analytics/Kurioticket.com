name: PR 5012 conflict fix

on:
  push:
    branches:
      - codex/align-flight-results-filter-behavior

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/align-flight-results-filter-behavior
          fetch-depth: 0

      - name: Merge latest dev
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin dev
          git merge --no-commit --no-ff origin/dev || true
          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          unexpected="$(printf '%s\n' "$conflicts" | grep -Ev '^(apps/mobile/src/features/search/ApprovedResultsScreen.tsx|apps/mobile/src/features/search/flightResultsPagination.test.ts|apps/mobile/src/features/search/flightSortExperience.test.ts)$' || true)"
          test -z "$unexpected"
          git checkout origin/dev -- apps/mobile/src/features/search/ApprovedResultsScreen.tsx apps/mobile/src/features/search/flightResultsPagination.test.ts apps/mobile/src/features/search/flightSortExperience.test.ts
          python .github/pr5012_resolve.py
          git add apps/mobile/src/features/search/ApprovedResultsScreen.tsx apps/mobile/src/features/search/flightResultsPagination.test.ts apps/mobile/src/features/search/flightSortExperience.test.ts
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Type-check mobile app
        working-directory: apps/mobile
        run: npm run typecheck

      - name: Run focused filter and pagination tests
        working-directory: apps/mobile
        run: node --test --require ./testAssetSetup.cjs --import jiti/register src/features/search/FlightFilterSheet.test.ts src/features/search/flightFilters.test.ts src/features/search/flightResultsPagination.test.ts src/features/search/flightResultsQuickControls.test.ts src/features/search/flightSortExperience.test.ts

      - name: Publish resolved merge
        run: |
          set -euo pipefail
          git rm .github/workflows/pr5012-conflict-fix.yml .github/pr5012_resolve.py
          git add -A
          git commit -m 'Merge dev into codex/align-flight-results-filter-behavior'
          git push origin HEAD:codex/align-flight-results-filter-behavior
