name: PR 5233 locale repair

on:
  push:
    branches:
      - codex/refine-native-mobile-flight-details-screen
    paths:
      - .github/workflows/pr5233-locale-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/refine-native-mobile-flight-details-screen
          fetch-depth: 0

      - name: Align Flight Details dates with selected mobile locale
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/mobile/src/features/search/NativeFlightDetails.tsx")
          source = path.read_text()

          anchor = 'import { useAppTheme } from "../../theme/AppTheme";\n'
          replacement = anchor + 'import { useMobileLocalization } from "../../localization/MobileLocalizationProvider";\nimport { mobileLocales } from "../../localization/mobileLocalizationCatalog";\n'
          if source.count(anchor) != 1:
              raise SystemExit("NativeFlightDetails theme import anchor changed")
          source = source.replace(anchor, replacement, 1)

          anchor = '  const { theme } = useAppTheme();\n  const inset = useSafeAreaInsets();\n'
          replacement = '  const { theme } = useAppTheme();\n  const { locale } = useMobileLocalization();\n  const intlLocale = mobileLocales.find((option) => option.code === locale)?.intl ?? "en-US";\n  const inset = useSafeAreaInsets();\n'
          if source.count(anchor) != 1:
              raise SystemExit("NativeFlightDetails hook anchor changed")
          source = source.replace(anchor, replacement, 1)

          old_map = 'offerAirlineLogo={offer.airlineLogo} theme={theme}/>)}</View>'
          new_map = 'offerAirlineLogo={offer.airlineLogo} theme={theme} intlLocale={intlLocale}/>)}</View>'
          if source.count(old_map) != 1:
              raise SystemExit("Itinerary call anchor changed")
          source = source.replace(old_map, new_map, 1)

          old_signature = 'function Itinerary({leg,index,offerAirlineName,offerAirlineLogo,theme}:{leg:FlightLeg;index:number;offerAirlineName:string;offerAirlineLogo?:string|null;theme:ReturnType<typeof useAppTheme>["theme"]}) {'
          new_signature = 'function Itinerary({leg,index,offerAirlineName,offerAirlineLogo,theme,intlLocale}:{leg:FlightLeg;index:number;offerAirlineName:string;offerAirlineLogo?:string|null;theme:ReturnType<typeof useAppTheme>["theme"];intlLocale:string}) {'
          if source.count(old_signature) != 1:
              raise SystemExit("Itinerary signature anchor changed")
          source = source.replace(old_signature, new_signature, 1)

          for old, new in [
              ('const departureDate=providerLocalFlightDateLong(leg.departureTime);', 'const departureDate=providerLocalFlightDateLong(leg.departureTime,intlLocale);'),
              ('const departureShortDate=providerLocalFlightDate(leg.departureTime);', 'const departureShortDate=providerLocalFlightDate(leg.departureTime,intlLocale);'),
              ('const arrivalShortDate=providerLocalFlightDate(leg.arrivalTime);', 'const arrivalShortDate=providerLocalFlightDate(leg.arrivalTime,intlLocale);'),
          ]:
              if source.count(old) != 1:
                  raise SystemExit(f"date formatter anchor changed: {old}")
              source = source.replace(old, new, 1)
          path.write_text(source)

          test_path = Path("apps/mobile/src/features/search/flightDetailItinerary.test.ts")
          test = test_path.read_text()
          old = '''test("provider-local full and endpoint dates render without device-timezone conversion or visible day offsets",()=>{\n  assert.match(itinerary,/providerLocalFlightDateLong\\(leg\\.departureTime\\)/);\n  assert.match(itinerary,/departureShortDate=providerLocalFlightDate\\(leg\\.departureTime\\)/);\n  assert.match(itinerary,/arrivalShortDate=providerLocalFlightDate\\(leg\\.arrivalTime\\)/);'''
          new = '''test("provider-local full and endpoint dates use the selected app locale without device-timezone conversion or visible day offsets",()=>{\n  assert.match(source,/const \\{ locale \\} = useMobileLocalization\\(\\)/);\n  assert.match(source,/mobileLocales\\.find\\(\\(option\\) => option\\.code === locale\\)\\?\\.intl \\?\\? "en-US"/);\n  assert.match(source,/intlLocale=\\{intlLocale\\}/);\n  assert.match(itinerary,/providerLocalFlightDateLong\\(leg\\.departureTime,intlLocale\\)/);\n  assert.match(itinerary,/departureShortDate=providerLocalFlightDate\\(leg\\.departureTime,intlLocale\\)/);\n  assert.match(itinerary,/arrivalShortDate=providerLocalFlightDate\\(leg\\.arrivalTime,intlLocale\\)/);'''
          if test.count(old) != 1:
              raise SystemExit("flightDetailItinerary locale test anchor changed")
          test_path.write_text(test.replace(old, new, 1))

          integration_path = Path("apps/mobile/src/features/search/flightArrivalDayOffsetIntegration.test.ts")
          integration = integration_path.read_text()
          old = '''test("details present provider-local full and endpoint dates without visible calendar-day offsets", () => {\n  assert.match(detailSource, /providerLocalFlightDateLong\\(leg\\.departureTime\\)/);\n  assert.match(detailSource, /providerLocalFlightDate\\(leg\\.departureTime\\)/);\n  assert.match(detailSource, /providerLocalFlightDate\\(leg\\.arrivalTime\\)/);'''
          new = '''test("details present provider-local full and endpoint dates in the selected app locale without visible calendar-day offsets", () => {\n  assert.match(detailSource, /const \\{ locale \\} = useMobileLocalization\\(\\)/);\n  assert.match(detailSource, /providerLocalFlightDateLong\\(leg\\.departureTime,intlLocale\\)/);\n  assert.match(detailSource, /providerLocalFlightDate\\(leg\\.departureTime,intlLocale\\)/);\n  assert.match(detailSource, /providerLocalFlightDate\\(leg\\.arrivalTime,intlLocale\\)/);'''
          if integration.count(old) != 1:
              raise SystemExit("flightArrivalDayOffsetIntegration locale test anchor changed")
          integration_path.write_text(integration.replace(old, new, 1))
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/mobile/src/features/search/NativeFlightDetails.tsx \
            apps/mobile/src/features/search/flightDetailItinerary.test.ts \
            apps/mobile/src/features/search/flightArrivalDayOffsetIntegration.test.ts
          git diff --cached --check
          git commit -m "fix(mobile): localize Flight Details endpoint dates"
          git push origin HEAD:codex/refine-native-mobile-flight-details-screen

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Typecheck mobile
        working-directory: apps/mobile
        run: npm run typecheck

      - name: Run focused locale regressions
        working-directory: apps/mobile
        run: >-
          node --test --require ./testAssetSetup.cjs --import jiti/register
          src/features/search/flightDetailItinerary.test.ts
          src/features/search/flightArrivalDayOffsetIntegration.test.ts
          src/features/search/flightArrivalDayOffset.test.ts

      - name: Run full mobile suite
        working-directory: apps/mobile
        run: npm test

      - name: Validate diff
        run: git diff --check
