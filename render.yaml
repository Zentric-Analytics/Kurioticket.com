services:
  - type: worker
    name: kurioticket-preview-release-worker
    runtime: node
    plan: standard
    branch: dev
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - services/preview-release/**
        - apps/mobile/scripts/**
        - apps/mobile/plugins/**
        - apps/mobile/config-plugins/**
        - apps/mobile/app.config.*
        - apps/mobile/app.json
        - apps/mobile/eas.json
        - apps/mobile/release-policy.json
        - apps/mobile/package.json
        - apps/mobile/package-lock.json
        - package.json
        - package-lock.json
        - render.yaml
    buildCommand: npm ci && npm --prefix apps/mobile ci
    startCommand: node services/preview-release/worker.mjs
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: PREVIEW_RELEASE_MODE
        value: active
      - key: PREVIEW_POLL_INTERVAL_MS
        value: 60000
      - key: PREVIEW_LEASE_MS
        value: 90000
      - key: PREVIEW_CYCLE_DEADLINE_MS
        value: 18000000
      - key: DATABASE_URL
        fromDatabase:
          name: kurioticket-preview-release-db
          property: connectionString
      - key: GITHUB_READ_TOKEN
        sync: false
      # Optional, separately scoped to commit-status write. Read-only polling works without it.
      - key: GITHUB_STATUS_TOKEN
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_STAGING_SERVICE_ID
        sync: false
      - key: EXPO_TOKEN
        sync: false
      - key: APP_STORE_CONNECT_ISSUER_ID
        sync: false
      - key: APP_STORE_CONNECT_KEY_ID
        sync: false
      - key: APP_STORE_CONNECT_PRIVATE_KEY
        sync: false
      - key: APP_STORE_CONNECT_PREVIEW_APP_ID
        sync: false
      - key: APP_STORE_CONNECT_PREVIEW_BETA_GROUP_ID
        sync: false
      # Must match the same secret on kurioticket-web-staging.
      - key: PREVIEW_BUILD_NOTIFICATION_SECRET
        sync: false

  - type: cron
    name: kurioticket-price-alerts
    runtime: node
    plan: starter
    branch: main
    autoDeploy: true
    schedule: '0 * * * *'
    buildCommand: 'true'
    startCommand: >-
      curl -fsS -X POST "https://kurioticket.com/api/cron/price-alerts"
      -H "Authorization: Bearer $PRICE_ALERTS_CRON_SECRET"
      -H "Content-Type: application/json"
    envVars:
      - key: PRICE_ALERTS_CRON_SECRET
        sync: false

  - type: cron
    name: kurioticket-travel-inspiration
    runtime: node
    plan: starter
    branch: main
    autoDeploy: true
    schedule: '0 * * * *'
    buildCommand: 'true'
    startCommand: >-
      curl -fsS -X POST "https://kurioticket.com/api/cron/travel-inspiration"
      -H "Authorization: Bearer $TRAVEL_INSPIRATION_CRON_SECRET"
      -H "Content-Type: application/json"
    envVars:
      - key: TRAVEL_INSPIRATION_CRON_SECRET
        sync: false


  - type: cron
    name: kurioticket-homepage-fares-refresh
    runtime: node
    plan: starter
    branch: main
    autoDeploy: true
    schedule: '0 */4 * * *'
    buildCommand: 'true'
    startCommand: >-
      curl -fsS -X POST "https://kurioticket.com/api/internal/homepage-fares/refresh"
      -H "Authorization: Bearer $HOMEPAGE_FARES_CRON_SECRET"
      -H "Content-Type: application/json"
    envVars:
      - key: HOMEPAGE_FARES_CRON_SECRET
        sync: false

  - type: web
    name: kurioticket-web
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run db:deploy:render && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: DATABASE_URL
        fromDatabase:
          name: kurioticket-postgres
          property: connectionString
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_MAPS_EMBED_API_KEY
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: DUFFEL_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: HOMEPAGE_FARES_CRON_SECRET
        sync: false
      - key: PRICE_ALERTS_CRON_SECRET
        sync: false
      # Return production to exact `live` when an approved Cars provider is connected.

  - type: web
    name: kurioticket-web-staging
    runtime: node
    plan: free
    branch: dev
    # Preview delivery is owned exclusively by kurioticket-preview-release.
    autoDeploy: false
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    preDeployCommand: npm run db:deploy:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: DATABASE_URL
        fromDatabase:
          name: kurioticket-postgres-staging
          property: connectionString
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_MAPS_EMBED_API_KEY
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: STAGING_EMAIL_DELIVERY_ENABLED
        value: "true"
      - key: PREVIEW_BUILD_NOTIFICATION_SECRET
        sync: false
      - key: DUFFEL_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: HOMEPAGE_FARES_CRON_SECRET
        sync: false
      - key: PRICE_ALERTS_CRON_SECRET
        sync: false

databases:
  - name: kurioticket-preview-release-db
    databaseName: kurioticket_preview_release
    user: kurioticket_preview_release
    plan: starter

  - name: kurioticket-postgres
    databaseName: kurioticket
    user: kurioticket
    plan: free

  - name: kurioticket-postgres-staging
    databaseName: kurioticket_staging
    user: kurioticket_staging
    plan: free
